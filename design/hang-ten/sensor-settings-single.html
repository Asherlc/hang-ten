  <script>
(function () {
  var root = document.querySelector('[data-dc-artboard]');
  if (!root) return;
  var style = getComputedStyle(document.documentElement);
  var fill = style.getPropertyValue('--dc-reveal-fill').trim();
  var ink = style.getPropertyValue('--dc-reveal-ink').trim();
  if (fill) root.style.setProperty('--dc-reveal-fill', fill);
  if (ink) root.style.setProperty('--dc-reveal-ink', ink);
  function refresh() {
    var texts = root.querySelectorAll('.dc-text');
    for (var i = 0; i < texts.length; i++) {
      var el = texts[i];
      var original = el.getAttribute('data-dc-original') || '';
      var changed = el.textContent !== original;
      el.classList.toggle('dc-revealed', changed);
      el.setAttribute('aria-label', changed ? el.textContent : original);
    }
  }
  refresh();
  if (window.MutationObserver) {
    new MutationObserver(refresh).observe(root, {
      subtree: true, childList: true, characterData: true
    });
  }
})();
  </script>
