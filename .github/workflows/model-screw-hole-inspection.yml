name: Inspect model screw holes

on:
  push:
    branches:
      - fix/remove-model-screw-holes-20260921
    paths:
      - .github/workflows/model-screw-hole-inspection.yml

permissions:
  contents: read

jobs:
  collect-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: false
      - name: Materialize live model assets
        run: git lfs pull --include='Hangboards/**/*.usdz' --exclude=''
      - name: Package an exact geometry inspection snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          owner = 'remove-model-screw-holes-20260921'
          out = root / '.context' / owner
          out.mkdir(parents=True, exist_ok=True)
          paths = set()
          for base in ('Hangboards', 'Tools/HangboardModels', 'Tools/HangboardPackages'):
              directory = root / base
              if directory.exists():
                  paths.update(p for p in directory.rglob('*') if p.is_file() and p.suffix.lower() in {'.usdz', '.json', '.py', '.toml', '.md'})
          for base in ('docs/source-audits',):
              paths.update(p for p in (root / base).glob('*.md'))
          inventory = []
          with zipfile.ZipFile(out / 'model-inspection.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=3) as archive:
              for p in sorted(paths):
                  data = p.read_bytes()
                  if p.suffix == '.usdz' and data.startswith(b'version https://git-lfs.github.com/spec/v1'):
                      raise SystemExit(f'Unresolved LFS asset: {p.relative_to(root)}')
                  relative = p.relative_to(root).as_posix()
                  archive.writestr(relative, data)
                  if p.suffix == '.usdz':
                      inventory.append({'path': relative, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
              manifest = {'owner': owner, 'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'models': inventory}
              archive.writestr('inspection-manifest.json', json.dumps(manifest, indent=2) + '\n')
          (out / 'inventory.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Upload inspection snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remove-model-screw-holes-20260921-inspection
          path: .context/remove-model-screw-holes-20260921/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
