name: Dependabot Auto-Merge

"on":
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  pull-requests: read

jobs:
  discover-pr:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    name: Resolve eligible Dependabot PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}

    steps:
      - name: Resolve PR from workflow run head SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pulls_json="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls" --header 'Accept: application/vnd.github+json')"
          pr_number="$(
            printf '%s' "$pulls_json" | jq -r --arg repository "$REPOSITORY" '
              [ .[]
                | select(
                    .state == "open"
                    and .draft == false
                    and .user.login == "dependabot[bot]"
                    and .head.repo.full_name == $repository
                  )
              ]
              | if length == 1 then .[0].number | tostring else empty end
            '
          )"

          if [ -z "$pr_number" ]; then
            echo "No eligible Dependabot PR found for head SHA $HEAD_SHA"
            exit 0
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

  enable-auto-merge:
    needs:
      - discover-pr
    if: ${{ needs.discover-pr.outputs.pr_number != '' }}
    name: Enable auto-merge for Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: dependabot-auto-merge-pr-${{ needs.discover-pr.outputs.pr_number }}
      cancel-in-progress: false

    steps:
      - name: Request squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.discover-pr.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr merge --repo "$REPOSITORY" --auto --squash "$PR_NUMBER"
