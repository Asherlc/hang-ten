name: Batch05 original source archive
on:
  push:
    branches: [artifacts/batch05-source-evidence-20260920-1840]
    paths: [.github/workflows/batch05-source-evidence.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retain public manufacturer originals
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,json,hashlib,datetime,concurrent.futures
          SOURCES = [{'model': 'frictitious-doormount-pro-7', 'sourceId': 'D1', 'url': 'https://frictitiousclimbing.com/products/doormount-pro', 'publisher': 'Frictitious'}, {'model': 'frictitious-doormount-pro-7', 'sourceId': 'D2', 'url': 'https://cdn.instant.so/sites/bok0avMvQiSRIEaF/assets/akfH3QAsM57AjzC5/pro7.jpg?width=3840', 'publisher': 'Frictitious embedded image'}, {'model': 'frictitious-doormount-pro-7', 'sourceId': 'D3', 'url': 'https://frictitiousclimbing.com/cdn/shop/files/DMP-7-Front_d597f381-f23b-4d16-a5b2-d9d201171fa5.jpg?v=1784063035&width=3840', 'publisher': 'Frictitious'}, {'model': 'frictitious-doormount-pro-7', 'sourceId': 'D4', 'url': 'https://frictitiousclimbing.com/cdn/shop/files/DMP-Rubber-back.jpg?v=1779384119&width=3840', 'publisher': 'Frictitious'}, {'model': 'frictitious-megalith', 'sourceId': 'M1', 'url': 'https://frictitiousclimbing.com/products/megalith', 'publisher': 'Frictitious'}, {'model': 'frictitious-megalith', 'sourceId': 'M2', 'url': 'https://frictitiousclimbing.com/cdn/shop/files/Megalith-Front.jpg?v=1780436232&width=3840', 'publisher': 'Frictitious'}, {'model': 'frictitious-megalith', 'sourceId': 'M3', 'url': 'https://frictitiousclimbing.com/cdn/shop/files/Megalith-Front-1.jpg?v=1780436232&width=3840', 'publisher': 'Frictitious'}, {'model': 'frictitious-megalith', 'sourceId': 'M4', 'url': 'https://frictitiousclimbing.com/cdn/shop/files/Mega-4.jpg?v=1764914587&width=3840', 'publisher': 'Frictitious'}, {'model': 'frictitious-megalith', 'sourceId': 'M5', 'url': 'https://frictitiousclimbing.com/cdn/shop/files/Mega-2.jpg?v=1764914587&width=3840', 'publisher': 'Frictitious'}, {'model': 'trango-rock-prodigy-forge', 'sourceId': 'F1', 'url': 'https://trango.com/products/rock-prodigy-forge', 'publisher': 'Trango'}, {'model': 'trango-rock-prodigy-forge', 'sourceId': 'F2', 'url': 'https://cdn.shopify.com/s/files/1/0282/7557/2841/files/forge-grip-identification-chart.pdf?v=1588609203', 'publisher': 'Trango'}, {'model': 'trango-rock-prodigy-forge', 'sourceId': 'F3', 'url': 'https://cdn.shopify.com/s/files/1/0282/7557/2841/files/Rock_Prodigy_Forge_Depth_Guide.pdf?v=1634672887', 'publisher': 'Trango'}, {'model': 'trango-rock-prodigy-forge', 'sourceId': 'F4', 'url': 'https://cdn.shopify.com/s/files/1/0282/7557/2841/files/2018_update_forge_instructions_booklet.pdf?v=1588609204', 'publisher': 'Trango'}, {'model': 'trango-rock-prodigy-forge', 'sourceId': 'F5', 'url': 'https://trango.com/cdn/shop/products/22820_Rock_Prodigy_Forge_Main_Image.jpg?v=1582662057&width=1946', 'publisher': 'Trango'}, {'model': 'trango-rock-prodigy-forge', 'sourceId': 'F6', 'url': 'https://trango.com/cdn/shop/files/22820_RockProdigyForge_AltImage1_6974b648-94cf-464a-8ea9-f0a14eb8958b.png?v=1755037539&width=1946', 'publisher': 'Trango'}, {'model': 'trango-rock-prodigy-forge', 'sourceId': 'F7', 'url': 'https://trango.com/cdn/shop/files/22820_RockProdigyForge_AltIMage3_6794e534-75a5-4109-8a9e-0eb213f5a0e0.png?v=1755037540&width=1946', 'publisher': 'Trango'}, {'model': 'trango-rock-prodigy-forge', 'sourceId': 'F8', 'url': 'https://trango.com/cdn/shop/files/22820_RockProdigyForge_AltImage4_07218e65-ff06-4c5e-9590-f694e7d67b70.png?v=1755037540&width=1946', 'publisher': 'Trango'}, {'model': 'trango-rock-prodigy-forge', 'sourceId': 'F9', 'url': 'https://rockclimberstrainingmanual.com/2015/09/03/the-worlds-most-technologically-advanced-finger-training-system-the-forge/', 'publisher': 'Product designers / Anderson brothers'}, {'model': 'trango-rock-prodigy-natural', 'sourceId': 'N1', 'url': 'https://trango.com/products/rock-prodigy-natural', 'publisher': 'Trango'}, {'model': 'trango-rock-prodigy-natural', 'sourceId': 'N2', 'url': 'https://cdn.shopify.com/s/files/1/0282/7557/2841/files/Rock_Prodigy_Natural_Consumer_Quick_Start_Final_Digital_9.21.21.pdf?v=1656514361', 'publisher': 'Trango'}, {'model': 'trango-rock-prodigy-natural', 'sourceId': 'N3', 'url': 'https://trango.com/cdn/shop/products/22850_RockProdigyNatural_AltImage2_Rails.jpg?v=1724692982&width=1946', 'publisher': 'Trango'}, {'model': 'trango-rock-prodigy-natural', 'sourceId': 'N4', 'url': 'https://trango.com/cdn/shop/products/22850_RockProdigyNatural_AltImage1_Pockets.jpg?v=1724692982&width=1946', 'publisher': 'Trango'}, {'model': 'zlagboard-evo', 'sourceId': 'E1', 'url': 'https://zlagboard.com/hangboards', 'publisher': 'Vertical-Life / Zlagboard'}, {'model': 'zlagboard-evo', 'sourceId': 'E2', 'url': 'https://zlagboard.com/assets/web/zlagboard-evo-holds-014x2x-00d8566361fdbbb0740896a8a7805e652d20e09b2fbe54eb2d36b4b7ecb66d10.png', 'publisher': 'Vertical-Life / Zlagboard'}, {'model': 'zlagboard-evo', 'sourceId': 'E3', 'url': 'https://zlagboard.com/assets/web/Zlagboard_EVO-newscreen2x-fb153e0817b3e2ffc54e8fabd042ed5e7fffa804ef80388787da3b777004da3f.png', 'publisher': 'Vertical-Life / Zlagboard'}, {'model': 'zlagboard-evo', 'sourceId': 'E4', 'url': 'https://chalkr.de/vertical-life-zlagboard-evo-trainingsboard.html', 'publisher': 'Chalkr'}, {'model': 'zlagboard-evo', 'sourceId': 'E5', 'url': 'https://www.oliunid.com/zlagboard-zlagboard-evo-climbing-hangboard', 'publisher': 'Oliunid'}, {'model': 'zlagboard-pro-2-0', 'sourceId': 'P1', 'url': 'https://zlagboard.com/hangboards', 'publisher': 'Vertical-Life / Zlagboard'}, {'model': 'zlagboard-pro-2-0', 'sourceId': 'P2', 'url': 'https://zlagboard.com/assets/web/zlagboard-pro2-holds-014x2x-af05a1450fd55d0cdba84c0bcd43206f2798cf426cb31f5bf762d33acb66d34d.png', 'publisher': 'Vertical-Life / Zlagboard'}, {'model': 'zlagboard-pro-2-0', 'sourceId': 'P3', 'url': 'https://zlagboard.com/assets/web/Zlagboard-2019-smaller2x-8011f7e115f3707e78d58c5b3587d3a15fd82b009c421a6c6dbc9f560e50dc1b.png', 'publisher': 'Vertical-Life / Zlagboard'}, {'model': 'zlagboard-pro-2-0', 'sourceId': 'P4', 'url': 'https://chalkr.de/vertical-life-zlagboard-pro-trainingsboard.html', 'publisher': 'Chalkr'}, {'model': 'zlagboard-pro-2-0', 'sourceId': 'P5', 'url': 'https://hikinginfinland.com/2015/06/zlagboard-pro-review.html', 'publisher': 'Hiking in Finland'}, {'model': 'trango-rock-prodigy-natural', 'sourceId': 'N5', 'url': 'https://trango.com/cdn/shop/products/22850_RockProdigyNatural_MainImage_TopDownMarkings.jpg?v=1755037315&width=1946', 'publisher': 'Trango'}, {'model': 'trango-rock-prodigy-natural', 'sourceId': 'N6', 'url': 'https://trango.com/cdn/shop/products/RPShootBaker_Natural_11.jpg?v=1724692982&width=1946', 'publisher': 'Trango'}]
          OUT=pathlib.Path('evidence');OUT.mkdir(exist_ok=True)
          def capture(s):
              r=dict(s);r['retrievedUTC']=datetime.datetime.now(datetime.timezone.utc).isoformat()
              try:
                  req=urllib.request.Request(s['url'],headers={'User-Agent':'Mozilla/5.0 (source-reference-archive)','Accept':'*/*'})
                  with urllib.request.urlopen(req,timeout=35) as f:
                      data=f.read(40_000_001);r.update(httpStatus=f.status,responseURL=f.url,contentType=f.headers.get('Content-Type',''),etag=f.headers.get('ETag'),lastModified=f.headers.get('Last-Modified'))
                  if len(data)>40_000_000:raise ValueError('source exceeds 40 MB cap')
                  isimg=(data.startswith(b'\x89PNG') or data.startswith(b'\xff\xd8') or data.startswith(b'RIFF'))
                  ispdf=data.startswith(b'%PDF')
                  path=urllib.parse.urlparse(s['url']).path.lower()
                  if any(path.endswith(x) for x in ['.png','.jpg','.jpeg','.webp','.pdf']) and not (isimg or ispdf):raise ValueError('expected source media; server returned non-media content')
                  ext='.pdf' if ispdf else '.png' if data.startswith(b'\x89PNG') else '.jpg' if data.startswith(b'\xff\xd8') else '.webp' if data.startswith(b'RIFF') else '.html'
                  dest=OUT/s['model']/(s['sourceId']+ext);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
                  r.update(status='RETAINED',localOriginalFilename=str(dest.relative_to(OUT)),bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),physicalMedia=isimg or ispdf)
              except Exception as e:r.update(status='UNAVAILABLE',error=repr(e),localOriginalFilename=None)
              print(s['sourceId'],r['status'],r.get('bytes',0),flush=True)
              return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:results=list(ex.map(capture,SOURCES))
          report={'schemaVersion':2,'method':'Original HTTP response bytes; no transformed or generated image substitutes','retained':sum(r['status']=='RETAINED' for r in results),'attempted':len(results),'sources':results}
          (OUT/'retrieval-results.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({'retained':report['retained'],'attempted':len(results)}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch05-original-source-archive
          path: evidence/
          retention-days: 7
