name: Release to App Store Connect

# Automatic releases require a successful CI run on main. Authorized maintainers
# can also manually release the selected workflow revision.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: app-store-connect-release
  cancel-in-progress: false

jobs:
  compile-manual-assets:
    if: github.event_name == 'workflow_dispatch'
    name: Compile manually selected runtime assets
    cache-mode: read
    uses: ./.github/workflows/runtime-assets.yml
    with:
      source-ref: ${{ github.sha }}

  board-assets:
    needs: compile-manual-assets
    if: >-
      !cancelled() && (
      (github.event_name == 'workflow_dispatch' && needs.compile-manual-assets.result == 'success') ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      ))
    name: Prepare tested release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.owner.outputs.owner }}-release-board-assets-${{ github.run_id }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          lfs: false
          persist-credentials: false

      - name: Load LFS helper from the release workflow revision
        id: lfs-helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          # The tested product revision can predate this helper. Fetch workflow
          # tooling from its own revision without moving the tested Git HEAD.
          owner=$(basename "${PASEO_WORKTREE_PATH:-$PWD}")
          helper_root="$PWD/.context/$owner-release-lfs-helper"
          test ! -e "$helper_root"
          mkdir -p "$helper_root"
          printf '%s\n' "$helper_root" > "$helper_root/owned-resources"
          cleanup_helper() {
            local result=$?
            trap - EXIT
            rm -rf "$helper_root"
            test ! -e "$helper_root" || exit 1
            return "$result"
          }
          trap cleanup_helper EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/actions/materialize-lfs/action.yml?ref=$WORKFLOW_REVISION" \
            -H 'Accept: application/vnd.github.raw+json' > "$helper_root/action.yml"
          mkdir -p .github/actions/materialize-lfs
          mv "$helper_root/action.yml" .github/actions/materialize-lfs/action.yml

      - name: Materialize cached CAD sources
        uses: ./.github/actions/materialize-lfs

      - name: Set up catalog validator Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Identify catalog owner
        id: owner
        run: echo "owner=$(basename "${PASEO_WORKTREE_PATH:-$PWD}")" >> "$GITHUB_OUTPUT"

      - name: Restore manually compiled catalog
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.compile-manual-assets.outputs.artifact-name }}
          path: .

      - name: Select immutable catalog from the successful CI attempt
        if: github.event_name == 'workflow_run'
        id: tested-catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          owner=$(basename "${PASEO_WORKTREE_PATH:-$PWD}")
          artifact_pages=".context/$owner-runtime-assets/artifact-pages.json"
          job_pages=".context/$owner-runtime-assets/job-pages.json"
          mkdir -p "$(dirname "$artifact_pages")"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts?per_page=100" > "$artifact_pages"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?filter=all&per_page=100" > "$job_pages"
          artifact_id=$(python3 scripts/select-runtime-catalog.py \
            --artifact-pages "$artifact_pages" --job-pages "$job_pages" --owner "$owner" \
            --run-id "$CI_RUN_ID" --run-attempt "$CI_RUN_ATTEMPT")
          echo "artifact-id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Restore the exact catalog tested by CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.tested-catalog.outputs.artifact-id }}
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Verify tested source revision and catalog hashes
        run: |
          set -euo pipefail
          owner=$(basename "${PASEO_WORKTREE_PATH:-$PWD}")
          python3 Tools/HangboardCAD/runtime_asset_catalog.py \
            --manifest ".context/$owner-runtime-assets/catalog.json" --check

      - name: Upload compiled release catalog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.owner.outputs.owner }}-release-board-assets-${{ github.run_id }}
          overwrite: true
          path: |
            Hangboards/*/assets/*.usdz
            Hangboards/*/assets/*.model.json
            Hangboards/*/assets/*.physics.json
            Hangboards/*/assets/suspension.json
            HangTen/Resources/GripHand/hand-mesh.json
            .context/${{ steps.owner.outputs.owner }}-runtime-assets/catalog.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - board-assets
    if: >-
      !cancelled() && needs.board-assets.result == 'success' && (
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      ))
    name: Archive, sign, and upload
    runs-on: macos-26
    timeout-minutes: 60
    environment:
      name: app-store-connect
      url: https://appstoreconnect.apple.com/

    steps:
      # Automatic runs check out the exact commit whose CI run succeeded, while
      # manual runs check out the revision selected for workflow dispatch.
      # actions/checkout v4.2.2
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Load LFS helper from the release workflow revision
        id: lfs-helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          # The tested product revision can predate this helper. Fetch workflow
          # tooling from its own revision without moving the tested Git HEAD.
          owner=$(basename "${PASEO_WORKTREE_PATH:-$PWD}")
          helper_root="$PWD/.context/$owner-release-lfs-helper"
          test ! -e "$helper_root"
          mkdir -p "$helper_root"
          printf '%s\n' "$helper_root" > "$helper_root/owned-resources"
          cleanup_helper() {
            local result=$?
            trap - EXIT
            rm -rf "$helper_root"
            test ! -e "$helper_root" || exit 1
            return "$result"
          }
          trap cleanup_helper EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/actions/materialize-lfs/action.yml?ref=$WORKFLOW_REVISION" \
            -H 'Accept: application/vnd.github.raw+json' > "$helper_root/action.yml"
          mkdir -p .github/actions/materialize-lfs
          mv "$helper_root/action.yml" .github/actions/materialize-lfs/action.yml

      - name: Materialize cached CAD sources
        uses: ./.github/actions/materialize-lfs

      - name: Restore compiled board catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.board-assets.outputs.artifact-name }}
          path: .

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version

      # Apple-Actions/download-provisioning-profiles v6.1.0
      - name: Download App Store provisioning profile
        id: provisioning-profiles
        uses: Apple-Actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594
        with:
          bundle-id: com.hangten.training
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      # Apple-Actions/import-codesign-certs v7.0.0
      - name: Import Apple Distribution certificate
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Resolve signing profile
        env:
          PROFILES_JSON: ${{ steps.provisioning-profiles.outputs.profiles }}
        run: |
          set -euo pipefail
          profile_uuid="$(jq -er '.[0].udid' <<< "$PROFILES_JSON")"
          echo "PROVISIONING_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"

      - name: Select unique App Store version and build number
        run: |
          set -euo pipefail
          # Keep the App Store major/minor policy at 1.0; use the globally
          # monotonic workflow run number as the patch train. This gives each
          # new workflow run a new train after an earlier one is approved.
          marketing_version="1.0.${GITHUB_RUN_NUMBER}"
          # Keep retries unique: a rerun gets a new attempt component.
          build_number=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          if (( build_number > 2147483647 )); then
            echo "Build number $build_number exceeds Apple's supported range" >&2
            exit 1
          fi
          echo "MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "Using App Store version $marketing_version"
          echo "Using App Store build number $build_number"

      - name: Validate App Store metadata
        env:
          SWIFT_PACKAGE_CACHE_PATH: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
        run: scripts/validate-app-store-metadata.sh

      - name: Archive signed release
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}
        run: |
          set -euo pipefail
          archive_path="$PWD/build/HangTen.xcarchive"
          mkdir -p "$PWD/build"
          build_settings_xcconfig="$(mktemp "$RUNNER_TEMP/hang-ten-build-settings.XXXXXX")"
          # Expand the step-local path when the trap runs.
          # shellcheck disable=SC2016
          trap 'rm -f "$build_settings_xcconfig"' EXIT
          umask 077
          printf 'ANALYTICS_API_KEY = %s\n' "$ANALYTICS_API_KEY" > "$build_settings_xcconfig"
          chmod 600 "$build_settings_xcconfig"
          unset ANALYTICS_API_KEY
          xcodebuild \
            -project HangTen.xcodeproj \
            -scheme HangTen \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/hang-ten-swiftpm-source-packages" \
            -showBuildTimingSummary \
            HANGTEN_DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            HANGTEN_PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -xcconfig "$build_settings_xcconfig" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean archive

      - name: Verify archived bundle
        run: |
          set -euo pipefail
          app_path="$PWD/build/HangTen.xcarchive/Products/Applications/HangTen.app"
          test -d "$app_path"
          otool -l "$app_path/HangTen" | awk '
            $1 == "cmd" && $2 == "LC_RPATH" { in_rpath = 1; next }
            in_rpath && $1 == "path" && $2 == "@executable_path/Frameworks" { found = 1 }
            in_rpath && $1 == "cmd" { in_rpath = 0 }
            END { exit !found }
          ' || { echo "Archived HangTen executable is missing @executable_path/Frameworks" >&2; exit 1; }
          archived_marketing_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")"
          [[ "$archived_marketing_version" == "$MARKETING_VERSION" ]] || {
            echo "Archived version $archived_marketing_version does not match selected version $MARKETING_VERSION" >&2
            exit 1
          }
          echo "Version: $archived_marketing_version"
          echo "Build: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Upload iOS debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_IOS_PROJECT }}
        run: |
          set -euo pipefail
          : "${SENTRY_AUTH_TOKEN:?Configure the SENTRY_AUTH_TOKEN secret}"
          : "${SENTRY_ORG:?Configure the SENTRY_ORG variable}"
          : "${SENTRY_PROJECT:?Configure the SENTRY_IOS_PROJECT variable}"
          brew install getsentry/tools/sentry-cli
          dsym_dir="$PWD/build/HangTen.xcarchive/dSYMs"
          test -d "$dsym_dir"
          find "$dsym_dir" -name '*.dSYM' -type d -print -quit | grep -q .
          sentry-cli debug-files upload "$dsym_dir"

      - name: Export App Store package
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export_options="$PWD/build/ExportOptions.plist"
          cp .github/ExportOptions.plist "$export_options"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.hangten.training $PROVISIONING_PROFILE_UUID" "$export_options"
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/HangTen.xcarchive" \
            -exportOptionsPlist "$export_options" \
            -exportPath "$PWD/build/export"
          test -s "$PWD/build/export/HangTen.ipa"

      # Apple-Actions/upload-testflight-build v5.2.1
      - name: Upload to App Store Connect
        uses: Apple-Actions/upload-testflight-build@14df18fee5a4ff3b76971dd382f033494a0194e9
        with:
          app-path: build/export/HangTen.ipa
          app-type: ios
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          backend: appstore-api
          wait-for-processing: 'true'
