name: CAD runtime session
on:
  push:
    branches: [feat/single-file-freecad-sources-20260922]
    paths: [.github/workflows/cad-runtime-session.yml]
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cad-runtime-session
          run-id: 35765299364
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cad-runtime-session
      - name: Split runtime for transport
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cad-runtime-session"
          sha256sum runtime.tar.gz > SHA256SUMS.txt
          split -b 256M -d -a 2 runtime.tar.gz runtime.part-
      - uses: actions/upload-artifact@v4
        with:
          name: cad-runtime-part-00
          path: |
            ${{ runner.temp }}/cad-runtime-session/runtime.part-00
            ${{ runner.temp }}/cad-runtime-session/SHA256SUMS.txt
            ${{ runner.temp }}/cad-runtime-session/layout.txt
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: cad-runtime-part-01
          path: ${{ runner.temp }}/cad-runtime-session/runtime.part-01
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: cad-runtime-part-02
          path: ${{ runner.temp }}/cad-runtime-session/runtime.part-02
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: cad-runtime-part-03
          path: ${{ runner.temp }}/cad-runtime-session/runtime.part-03
          retention-days: 1
