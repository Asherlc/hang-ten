name: CAD runtime session
on:
  push:
    branches: [feat/single-file-freecad-sources-20260922]
    paths: [.github/workflows/cad-runtime-session.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch and verify official FreeCAD runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cad-runtime-session"
          cd "$RUNNER_TEMP/cad-runtime-session"
          curl -fL --retry 3 -o FreeCAD.AppImage https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
          echo '3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage' | sha256sum -c -
          chmod +x FreeCAD.AppImage
          ./FreeCAD.AppImage --appimage-extract > extract.log
          find squashfs-root/usr -maxdepth 3 -name '*FreeCAD*' -o -name '*python*' -o -name 'Part.so' > layout.txt
          cat squashfs-root/AppRun >> layout.txt
          mkdir wheels
          python -m pip download --dest wheels --only-binary=:all: --python-version 3.11 --platform manylinux_2_17_x86_64 --implementation cp --abi cp311 usd-core==26.8
          python -m pip download --dest wheels --only-binary=:all: pytest==9.0.2
          tar --exclude='*.a' --exclude='*/__pycache__' --exclude='*/include' --exclude='*/share' --exclude='*/translations' -czf runtime.tar.gz squashfs-root/usr/bin squashfs-root/usr/lib squashfs-root/usr/Mod wheels layout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cad-runtime-session
          path: |
            ${{ runner.temp }}/cad-runtime-session/runtime.tar.gz
            ${{ runner.temp }}/cad-runtime-session/layout.txt
          if-no-files-found: error
          retention-days: 1
