name: CAD runtime session
on:
  push:
    branches: [feat/single-file-freecad-sources-20260922]
    paths: [.github/workflows/cad-runtime-session.yml]
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Restore official runtime resources
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 -o FreeCAD.AppImage https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
          echo '3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage' | sha256sum -c -
          chmod +x FreeCAD.AppImage
          ./FreeCAD.AppImage --appimage-extract > /dev/null
          find squashfs-root/usr/share -maxdepth 4 -type d > resource-layout.txt
          tar --exclude='fonts' --exclude='doc' -czf cad-resources.tar.gz squashfs-root/usr/share
      - uses: actions/upload-artifact@v4
        with:
          name: cad-native-resources
          path: |
            ${{ runner.temp }}/cad-resources.tar.gz
            ${{ runner.temp }}/resource-layout.txt
          retention-days: 1
