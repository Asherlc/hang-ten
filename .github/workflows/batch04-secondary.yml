name: Batch04 secondary views
on:
  push:
    branches: [artifacts/batch04-evidence-20260920]
    paths: [.github/workflows/batch04-secondary.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download public product views
        run: |
          mkdir -p secondary
          python3 - <<'PY'
          import urllib.request,urllib.parse,re,html,json,pathlib,hashlib,concurrent.futures,datetime
          base=pathlib.Path('secondary'); records=[]
          pages=[('metolius-light-rail-2-0','https://poshmark.com/listing/Light-Rail-20-Wooden-Grip-Strength-Training-Bar-with-BluePurple-Rope-6a937e9c4adcb39531cfbea7'),('metolius-rock-rings-3d','https://www.ebay.com/itm/365881672541'),('metolius-rock-rings-3d','https://www.ebay.com/itm/236875136382'),('trango-rock-prodigy-pivot','https://outandbackoutdoor.com/products/trango-rock-prodigy-pivot-climbing-hold.js'),('trango-rock-prodigy-pivot','https://outandbackoutdoor.com/products/trango-rock-prodigy-pivot-elite-climbing-hold-package.js'),('owl-climb-poker','https://woguclimbing.com/wp-content/uploads/2019/04/nicol%C3%B2-ceria.jpg')]
          def get(job):
            slug,url=job;rec={'product':slug,'url':url,'retrievedUTC':datetime.datetime.now(datetime.timezone.utc).isoformat()};links=[]
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as r:data=r.read(16000000);rec.update(status=r.status,mime=r.headers.get('Content-Type',''),finalURL=r.url)
              fn=hashlib.sha256(url.encode()).hexdigest()[:12]+'-'+(pathlib.Path(urllib.parse.urlsplit(url).path).name or 'index.html');folder=base/slug;folder.mkdir(exist_ok=True);(folder/fn).write_bytes(data);rec.update(file=str((folder/fn).relative_to(base)),bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              if url.endswith('.js'):
                for i in json.loads(data).get('images',[]):links.append(urllib.parse.urljoin(url,i if isinstance(i,str) else i['src']))
              elif 'html' in rec['mime']:
                s=html.unescape(data.decode(errors='replace').replace('\\/','/'))
                links=re.findall(r'https?://[^\s<>"\x27]+?\.(?:jpg|jpeg|png|webp)(?:\?[^\s<>"\x27]*)?',s,re.I)
                links=[u for u in links if ('i.ebayimg.com/images/g/' in u or ('cloudfront.net' in u and '/posts/' in u) or 'poshmark.com/cover/' in u)]
                links=[re.sub(r's-l\d+(?:\.webp)?\.', 's-l1600.',u) if 'ebayimg' in u else u for u in links]
              return rec,links
            except Exception as e:rec['error']=str(e);return rec,[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
            todo=[]
            for r,links in ex.map(get,pages):records.append(r);todo.extend((r['product'],u) for u in sorted(set(links))[:35])
            for r,_ in ex.map(get,todo):records.append(r)
          (base/'retrieval-manifest.json').write_text(json.dumps(records,indent=2));print(json.dumps({'retained':sum('file' in r for r in records),'attempted':len(records)}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch04-secondary-originals
          path: secondary/
          retention-days: 7
