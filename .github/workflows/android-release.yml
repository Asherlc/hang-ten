name: Release Android to Google Play

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: google-play-release
  cancel-in-progress: false

jobs:
  release:
    name: Sign and publish internal AAB
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: google-play
      url: https://play.google.com/console/
    env:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      GOOGLE_PLAY_PACKAGE_NAME: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}
      HANGTEN_AMPLITUDE_API_KEY: ${{ secrets.HANGTEN_AMPLITUDE_API_KEY }}
      HANGTEN_SENTRY_DSN: ${{ vars.HANGTEN_SENTRY_DSN }}

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Model USDZ assets and the CAD authoring sources (FCStd) are Git LFS
          # objects; the Gradle build stages the USDZ into the bundle and
          # generates CAD boards' board.json from the FCStd.
          lfs: true

      # stageCanonicalAssets runs scripts/stage-board-packages.py, which
      # generates CAD-backed boards' board.json (Python 3.10+).
      # actions/setup-python v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      # actions/setup-java v4.7.1
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed release bundle
        run: |
          set -euo pipefail
          : "${ANDROID_UPLOAD_KEYSTORE_BASE64:?Configure the ANDROID_UPLOAD_KEYSTORE_BASE64 secret in the google-play environment}"
          : "${ANDROID_UPLOAD_KEYSTORE_PASSWORD:?Configure the ANDROID_UPLOAD_KEYSTORE_PASSWORD secret in the google-play environment}"
          : "${ANDROID_UPLOAD_KEY_ALIAS:?Configure the ANDROID_UPLOAD_KEY_ALIAS secret in the google-play environment}"
          : "${ANDROID_UPLOAD_KEY_PASSWORD:?Configure the ANDROID_UPLOAD_KEY_PASSWORD secret in the google-play environment}"
          : "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:?Configure the GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret in the google-play environment}"
          : "${GOOGLE_PLAY_PACKAGE_NAME:?Configure the GOOGLE_PLAY_PACKAGE_NAME variable in the google-play environment}"

          signing_dir="$RUNNER_TEMP/hang-ten-android-signing"
          keystore_path="$signing_dir/upload-keystore.jks"
          signing_properties="$signing_dir/gradle.properties"
          trap 'rm -rf "$signing_dir"' EXIT
          umask 077
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          {
            printf 'android.injected.signing.store.file=%s\n' "$keystore_path"
            printf 'android.injected.signing.store.password=%s\n' "$ANDROID_UPLOAD_KEYSTORE_PASSWORD"
            printf 'android.injected.signing.key.alias=%s\n' "$ANDROID_UPLOAD_KEY_ALIAS"
            printf 'android.injected.signing.key.password=%s\n' "$ANDROID_UPLOAD_KEY_PASSWORD"
          } > "$signing_properties"
          chmod 600 "$keystore_path" "$signing_properties"
          unset ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD
          GRADLE_USER_HOME="$signing_dir" ./Android/gradlew --no-daemon -p Android \
            -PAMPLITUDE_API_KEY="${HANGTEN_AMPLITUDE_API_KEY:-}" \
            -PSENTRY_DSN="${HANGTEN_SENTRY_DSN:-}" \
            :app:bundleRelease
          test -s Android/app/build/outputs/bundle/release/app-release.aab

      # actions/upload-artifact v4.6.2
      - name: Upload signed Android App Bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-release-aab-${{ github.run_id }}
          path: Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      # r0adkll/upload-google-play v1.1.3
      - name: Publish to Google Play internal track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}
          releaseFiles: Android/app/build/outputs/bundle/release/app-release.aab
          track: internal
