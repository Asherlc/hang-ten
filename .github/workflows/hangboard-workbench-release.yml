name: Build and release Hangboard Workbench

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hangboard-workbench-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-js:
    name: Test Workbench TypeScript
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: Tools/HangboardWorkbench/package-lock.json

      - name: Install and verify React TypeScript workbench
        working-directory: Tools/HangboardWorkbench
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run check:bundle

  test-python:
    name: Test Workbench Python
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: Tools/HangboardWorkbench/package-lock.json

      - name: Build generated Workbench bundle
        working-directory: Tools/HangboardWorkbench
        run: |
          set -euo pipefail
          npm ci
          npm run check:bundle

      # actions/setup-python v6.3.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Tools/HangboardWorkbench/pyproject.toml

      - name: Run Python suite
        run: |
          set -euo pipefail
          python_bin="$GITHUB_WORKSPACE/.context/hangboard-workbench-test-venv/bin/python"
          python -m venv "${python_bin%/bin/python}"
          "$python_bin" -m pip install --upgrade pip
          "$python_bin" -m pip install -e 'Tools/HangboardWorkbench[dev]'
          "$python_bin" -m pytest Tools/HangboardWorkbench/tests -q

  build:
    name: Build verified arm64 workbench
    needs:
      - test-js
      - test-python
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/cache v4.2.3
      - name: Restore native Swift build products
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: Tools/HangboardWorkbench/macos/.build
          key: hangboard-workbench-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/HangboardWorkbench/macos/Package.resolved') }}

      - name: Build and upload verified unsigned app
        id: build
        uses: ./.github/actions/build-hangboard-workbench

  release:
    name: Publish immutable workbench release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      # Required to create the immutable GitHub release and upload its assets.
      contents: write

    steps:
      # actions/checkout v7.0.1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/download-artifact v5.0.0
      - name: Download verified unsigned app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          # A "re-run failed jobs" keeps the successful build job from its
          # original attempt, so consume the name that job actually uploaded.
          name: ${{ needs.build.outputs.artifact-name }}
          path: release

      - name: Verify downloaded unsigned app
        run: |
          set -euo pipefail
          cd release
          shasum -a 256 -c hangboard-workbench-macos-arm64.sha256

      # actions/setup-python v6.3.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Tools/HangboardWorkbench/pyproject.toml

      - name: Install workbench release dependencies
        run: |
          set -euo pipefail
          python_bin="$GITHUB_WORKSPACE/.context/hangboard-workbench-release-venv/bin/python"
          python -m venv "${python_bin%/bin/python}"
          "$python_bin" -m pip install --upgrade pip
          "$python_bin" -m pip install -e 'Tools/HangboardWorkbench[dev]'
          swift --version

      - name: Install pinned Sentry CLI
        run: |
          set -euo pipefail
          sentry_cli_path="$RUNNER_TEMP/sentry-cli-2.58.6"
          sentry_cli_download="${sentry_cli_path}.download"
          cleanup() {
            rm -f "$sentry_cli_download"
          }
          trap cleanup EXIT
          curl --fail --location --silent --show-error \
            --output "$sentry_cli_download" \
            https://github.com/getsentry/sentry-cli/releases/download/2.58.6/sentry-cli-Darwin-arm64
          printf '%s  %s\n' \
            a2979237fc1ba46d2db4d551a9269affdd1e4f16e667cf2f398f490be7accafb \
            "$sentry_cli_download" | shasum -a 256 -c -
          chmod 0755 "$sentry_cli_download"
          mv "$sentry_cli_download" "$sentry_cli_path"
          printf 'SENTRY_CLI_PATH=%s\n' "$sentry_cli_path" >> "$GITHUB_ENV"

      # Apple-Actions/import-codesign-certs v7.0.0
      - name: Import Developer ID Application certificate
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466
        with:
          keychain: signing_temp
          p12-file-base64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_FILE_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}

      - name: Build, sign, and archive workbench app
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/release"
          python_bin="$GITHUB_WORKSPACE/.context/hangboard-workbench-release-venv/bin/python"
          runtime_dist_dir="$release_dir/signed-runtime-dist"
          runtime_work_dir="$RUNNER_TEMP/hangboard-workbench-signed-runtime-build"
          app_bundle="$release_dir/Hangboard Workbench.app"
          archive="$release_dir/hangboard-workbench-macos-arm64.zip"

          signing_identities="$(security find-identity -v -p codesigning signing_temp.keychain \
            | awk -F '\"' '/Developer ID Application:/{print $2}')"
          matching_identities="$(printf '%s\n' "$signing_identities" \
            | grep -F "($APPLE_TEAM_ID)" || true)"
          identity_count="$(printf '%s\n' "$matching_identities" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$identity_count" -ne 1 ]]; then
            echo "Expected exactly one Developer ID Application identity matching APPLE_TEAM_ID, found $identity_count." >&2
            exit 1
          fi
          signing_identity="$matching_identities"

          rm -rf "$runtime_dist_dir" "$runtime_work_dir" "$app_bundle"
          mkdir -p "$runtime_dist_dir" "$runtime_work_dir"
          "$python_bin" "$GITHUB_WORKSPACE/Tools/HangboardWorkbench/packaging/build.py" \
            --commit "$GITHUB_SHA" \
            --dist-dir "$runtime_dist_dir" \
            --work-dir "$runtime_work_dir" \
            --codesign-identity "$signing_identity"
          runtime_dir="$runtime_dist_dir/hangboard-workbench"

          swift build -c release --arch arm64 \
            -Xswiftc -g \
            --package-path Tools/HangboardWorkbench/macos
          shell_bin_dir="$(swift build -c release --arch arm64 \
            --package-path Tools/HangboardWorkbench/macos --show-bin-path)"
          built_shell="$shell_bin_dir/HangboardWorkbench"
          shell_dsym="$release_dir/HangboardWorkbench.dSYM"
          rm -rf "$shell_dsym"
          dsymutil "$built_shell" -o "$shell_dsym"
          test -d "$shell_dsym"
          "$python_bin" "$GITHUB_WORKSPACE/Tools/HangboardWorkbench/packaging/macos_app.py" \
            --shell "$built_shell" \
            --runtime-dir "$runtime_dir" \
            --output "$app_bundle" \
            --version "$GITHUB_RUN_NUMBER"

          runtime_root="$app_bundle/Contents/Resources/workbench-runtime"
          nested_macho_count=0
          while IFS= read -r -d '' candidate; do
            if file -b "$candidate" | grep -q 'Mach-O'; then
              codesign --force --sign "$signing_identity" --options runtime --timestamp "$candidate"
              nested_macho_count=$((nested_macho_count + 1))
            fi
          done < <(find "$runtime_root" -type f -print0)
          if [[ "$nested_macho_count" -eq 0 ]]; then
            echo "Expected at least one Mach-O file in the embedded runtime." >&2
            exit 1
          fi

          shell_executable="$app_bundle/Contents/MacOS/HangboardWorkbench"
          codesign --force --sign "$signing_identity" --options runtime --timestamp "$shell_executable"
          codesign --force --sign "$signing_identity" --options runtime --timestamp "$app_bundle"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"

          cd "$release_dir"
          ditto -c -k --keepParent "$app_bundle" "$archive"

      - name: Upload workbench debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_WORKBENCH_PROJECT }}
        run: |
          set -euo pipefail
          : "${SENTRY_AUTH_TOKEN:?Configure the SENTRY_AUTH_TOKEN secret}"
          : "${SENTRY_ORG:?Configure the SENTRY_ORG variable}"
          : "${SENTRY_PROJECT:?Configure the SENTRY_WORKBENCH_PROJECT variable}"
          shell_dsym="$GITHUB_WORKSPACE/release/HangboardWorkbench.dSYM"
          test -d "$shell_dsym"
          "$SENTRY_CLI_PATH" debug-files upload "$shell_dsym"

      - name: Notarize workbench archive
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${APPSTORE_ISSUER_ID:?Configure the APPSTORE_ISSUER_ID variable}"
          : "${APPSTORE_API_KEY_ID:?Configure the APPSTORE_API_KEY_ID variable}"
          : "${APPSTORE_API_PRIVATE_KEY:?Configure the APPSTORE_API_PRIVATE_KEY secret}"
          archive="$GITHUB_WORKSPACE/release/hangboard-workbench-macos-arm64.zip"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          cleanup() {
            status=$?
            trap - EXIT
            rm -f "$api_key_path"
            exit "$status"
          }
          trap cleanup EXIT
          test -f "$archive"
          umask 077
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          xcrun notarytool submit "$archive" \
            --key "$api_key_path" \
            --key-id "$APPSTORE_API_KEY_ID" \
            --issuer "$APPSTORE_ISSUER_ID" \
            --wait

      - name: Staple and validate workbench app
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/release"
          app_bundle="$release_dir/Hangboard Workbench.app"
          app_executable="$app_bundle/Contents/MacOS/HangboardWorkbench"
          archive="$release_dir/hangboard-workbench-macos-arm64.zip"
          zip_top_levels="$RUNNER_TEMP/hangboard-workbench-zip-top-levels.txt"
          smoke_log="$RUNNER_TEMP/hangboard-workbench-signed-app-smoke.log"
          app_pid=""
          app_child_pid=""
          cleanup() {
            status=$?
            trap - EXIT
            if [[ -n "$app_pid" ]]; then
              if kill -0 "$app_pid" 2>/dev/null; then
                kill -TERM "$app_pid" || true
              fi
              wait "$app_pid" || true
            fi
            if [[ -n "$app_child_pid" ]] && kill -0 "$app_child_pid" 2>/dev/null; then
              kill -TERM "$app_child_pid" || true
            fi
            if [[ "$status" -ne 0 && -f "$smoke_log" ]]; then
              cat "$smoke_log" >&2
            fi
            exit "$status"
          }
          trap cleanup EXIT

          xcrun stapler staple "$app_bundle"
          xcrun stapler validate "$app_bundle"
          spctl --assess --type execute --verbose=4 "$app_bundle"

          port=41739
          cd "$GITHUB_WORKSPACE"
          "$app_executable" --headless \
            --repository-root "$GITHUB_WORKSPACE" \
            --port "$port" >"$smoke_log" 2>&1 &
          app_pid=$!
          ready=false
          for _ in {1..30}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Signed app exited before becoming ready." >&2
              exit 1
            fi
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${port}/api/health" \
              | python -c 'import json,sys; payload=json.load(sys.stdin); assert payload == {"ok": True}'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            echo "Signed app did not become ready within 30 seconds." >&2
            exit 1
          fi

          app_child_pid="$(pgrep -P "$app_pid" || true)"
          if [[ -z "$app_child_pid" || "$app_child_pid" == *$'\n'* ]]; then
            echo "Expected exactly one backend owned by the signed app." >&2
            exit 1
          fi
          kill -TERM "$app_pid"
          if ! wait "$app_pid"; then
            echo "Signed app did not exit cleanly after SIGTERM." >&2
            exit 1
          fi
          if kill -0 "$app_child_pid" 2>/dev/null; then
            echo "Signed app backend remained after app shutdown." >&2
            exit 1
          fi
          app_pid=""
          app_child_pid=""

          rm -f "$archive"
          cd "$release_dir"
          ditto -c -k --keepParent "$app_bundle" "$archive"
          unzip -Z1 "$archive" | awk -F/ 'NF {print $1}' | sort -u > "$zip_top_levels"
          test "$(cat "$zip_top_levels")" = "Hangboard Workbench.app"
          shasum -a 256 hangboard-workbench-macos-arm64.zip > hangboard-workbench-macos-arm64.sha256
          shasum -a 256 -c hangboard-workbench-macos-arm64.sha256

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          select_latest_flag() {
            if [[ "$1" == "$2" ]]; then
              printf '%s\n' --latest
            else
              printf '%s\n' --latest=false
            fi
          }

          release_dir="$GITHUB_WORKSPACE/release"
          tag="hangboard-workbench-main-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::12}"
          short_sha="${GITHUB_SHA::12}"
          tag_response="$RUNNER_TEMP/hangboard-workbench-tag.json"
          tag_error="$RUNNER_TEMP/hangboard-workbench-tag-error.txt"
          release_response="$RUNNER_TEMP/hangboard-workbench-release.json"
          release_error="$RUNNER_TEMP/hangboard-workbench-release-error.txt"

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          latest_flag="$(select_latest_flag "$main_sha" "$GITHUB_SHA")"

          tag_exists=false
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >"$tag_response" 2>"$tag_error"; then
            tag_exists=true
            tag_type="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["object"]["type"])' "$tag_response")"
            tag_commit="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["object"]["sha"])' "$tag_response")"
            if [[ "$tag_type" == "tag" ]]; then
              annotated_tag_response="$RUNNER_TEMP/hangboard-workbench-annotated-tag.json"
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_commit" >"$annotated_tag_response"
              tag_commit="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["object"]["sha"])' "$annotated_tag_response")"
            fi
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Existing tag $tag targets $tag_commit, not $GITHUB_SHA." >&2
              exit 1
            fi
          elif ! grep -q 'HTTP 404' "$tag_error"; then
            cat "$tag_error" >&2
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >"$release_response" 2>"$release_error"; then
            release_commit="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["target_commitish"])' "$release_response")"
            if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
              echo "Existing release $tag targets $release_commit, not $GITHUB_SHA." >&2
              exit 1
            fi
            release_is_draft="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["draft"]).lower())' "$release_response")"
            if [[ "$release_is_draft" == "true" ]]; then
              python - "$release_response" <<'PY'
          import json
          import sys

          release = json.load(open(sys.argv[1]))
          if release["prerelease"]:
              raise SystemExit("Existing draft release must not be a prerelease.")
          asset_names = {asset["name"] for asset in release["assets"]}
          required_asset_names = {
              "hangboard-workbench-macos-arm64.sha256",
              "hangboard-workbench-macos-arm64.zip",
          }
          if not asset_names <= required_asset_names:
              raise SystemExit(
                  f"Existing draft release contains unexpected assets: {sorted(asset_names)}"
              )
          PY
              cd "$release_dir"
              gh release upload "$tag" \
                hangboard-workbench-macos-arm64.zip \
                hangboard-workbench-macos-arm64.sha256 \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
              gh release edit "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --draft=false \
                "$latest_flag"
              exit 0
            fi
            python - "$release_response" <<'PY'
          import json
          import sys

          release = json.load(open(sys.argv[1]))
          if release["draft"] or release["prerelease"] or not release["published_at"]:
              raise SystemExit("Existing release must be published and neither draft nor prerelease.")
          asset_names = sorted(asset["name"] for asset in release["assets"])
          required_asset_names = sorted([
              "hangboard-workbench-macos-arm64.sha256",
              "hangboard-workbench-macos-arm64.zip",
          ])
          if asset_names != required_asset_names:
              raise SystemExit(
                  f"Existing release assets must exactly match required assets: {asset_names}"
              )
          PY
            existing_release_dir="$RUNNER_TEMP/hangboard-workbench-existing-release"
            rm -rf "$existing_release_dir"
            mkdir -p "$existing_release_dir"
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "hangboard-workbench-macos-arm64.zip" \
              --pattern "hangboard-workbench-macos-arm64.sha256" \
              --dir "$existing_release_dir"
            for asset_name in \
              hangboard-workbench-macos-arm64.zip \
              hangboard-workbench-macos-arm64.sha256; do
              existing_asset="$existing_release_dir/$asset_name"
              if [[ ! -f "$existing_asset" ]]; then
                echo "Existing release asset is missing after download: $asset_name" >&2
                exit 1
              fi
            done
            if ! (
              cd "$existing_release_dir"
              shasum -a 256 -c hangboard-workbench-macos-arm64.sha256
            ); then
              echo "Existing release ZIP failed its downloaded SHA-256 checksum." >&2
              exit 1
            fi
            exit 0
          elif ! grep -q 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            exit 1
          fi

          if [[ "$tag_exists" == "true" ]]; then
            echo "Existing tag $tag has no release; creating the missing release." >&2
          fi
          cd "$release_dir"
          gh release create "$tag" \
            hangboard-workbench-macos-arm64.zip \
            hangboard-workbench-macos-arm64.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hangboard Workbench ${short_sha}" \
            --notes "Developer ID signed and notarized Apple Silicon workbench built from ${GITHUB_SHA}." \
            --draft
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            "$latest_flag"
