name: CodeQL

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed languages
    # Closing (or merging) a pull request only needs to enter the
    # concurrency group above so it cancels any stale runs still queued or
    # in progress for this ref; it does no other work.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.swift == 'true' }}
      python: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.python == 'true' }}
      javascript: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.javascript == 'true' }}

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      # dorny/paths-filter v3.0.2
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            swift:
              - '**/*.swift'
              - '**/Package.swift'
              - '**/Package.resolved'
              - 'HangTen.xcodeproj/**'
              - '.github/workflows/codeql.yml'
            python:
              - '**/*.py'
              - '**/pyproject.toml'
              - '**/requirements*.txt'
              - '**/poetry.lock'
              - '**/Pipfile.lock'
              - '.github/workflows/codeql.yml'
            javascript:
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/package.json'
              - '**/package-lock.json'
              - '**/yarn.lock'
              - '**/pnpm-lock.yaml'
              - '.github/workflows/codeql.yml'

  analyze-actions:
    name: Analyze (GitHub Actions)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # github/codeql-action v4.37.6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: actions
          build-mode: none

      # github/codeql-action v4.37.6
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          category: "/language:actions"

  analyze-swift:
    name: Analyze (Swift)
    runs-on: macos-26
    timeout-minutes: 60
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # github/codeql-action v4.37.6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: swift
          build-mode: manual

      - name: Build with CodeQL tracing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codeql-logs" "$RUNNER_TEMP/codeql-derived-data"
          xcodebuild \
            -project HangTen.xcodeproj \
            -scheme HangTen \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/codeql-derived-data" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/codeql-logs/xcodebuild.log"

      # github/codeql-action v4.37.6
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          category: "/language:swift"

  analyze-python:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # github/codeql-action v4.37.6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: python
          build-mode: none

      # github/codeql-action v4.37.6
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          category: "/language:python"

  analyze-javascript:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.javascript == 'true' }}

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # github/codeql-action v4.37.6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: javascript-typescript
          build-mode: none

      # github/codeql-action v4.37.6
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          category: "/language:javascript-typescript"

  codeql-gate:
    name: CodeQL gate
    runs-on: ubuntu-latest
    if: always() && github.event.action != 'closed'
    needs: [changes, analyze-actions, analyze-swift, analyze-python, analyze-javascript]

    steps:
      - name: Verify CodeQL analyses
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ACTIONS_RESULT: ${{ needs.analyze-actions.result }}
          SWIFT_RESULT: ${{ needs.analyze-swift.result }}
          PYTHON_RESULT: ${{ needs.analyze-python.result }}
          JAVASCRIPT_RESULT: ${{ needs.analyze-javascript.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" == "cancelled" || "$ACTIONS_RESULT" == "cancelled" ]]; then
            echo "CodeQL analysis was cancelled for this attempt; evaluating only non-cancelled runs."
            exit 0
          fi
          test "$CHANGES_RESULT" = success
          test "$ACTIONS_RESULT" = success
          for result in "$SWIFT_RESULT" "$PYTHON_RESULT" "$JAVASCRIPT_RESULT"; do
            test "$result" = success || test "$result" = skipped || test "$result" = cancelled
          done
