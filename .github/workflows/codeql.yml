name: CodeQL

on:
  pull_request:
    branches:
      - main
    paths:
      - HangTen/**
      - HangTen.xcodeproj/**
      - scripts/export-board-catalog.py
      - scripts/export-board-library.py
      - Tools/HangboardOnboarding/**
      - Tools/hold-highlight-editor/**
      - .github/workflows/codeql.yml
  push:
    branches:
      - main
    paths:
      - HangTen/**
      - HangTen.xcodeproj/**
      - scripts/export-board-catalog.py
      - scripts/export-board-library.py
      - Tools/HangboardOnboarding/**
      - Tools/hold-highlight-editor/**
      - .github/workflows/codeql.yml
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-swift:
    name: Analyze (Swift)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # github/codeql-action v4.37.6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: swift
          build-mode: manual

      - name: Build with CodeQL tracing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codeql-logs" "$RUNNER_TEMP/codeql-derived-data"
          xcodebuild \
            -project HangTen.xcodeproj \
            -scheme HangTen \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/codeql-derived-data" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/codeql-logs/xcodebuild.log"

      # github/codeql-action v4.37.6
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: "/language:swift"

  analyze-interpreted:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # github/codeql-action v4.37.6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      # github/codeql-action v4.37.6
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: "/language:${{ matrix.language }}"
