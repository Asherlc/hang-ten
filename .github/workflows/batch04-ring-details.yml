name: Batch04 Ring details
on:
  push:
    branches: [artifacts/batch04-evidence-20260920]
    paths: [.github/workflows/batch04-ring-details.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          mkdir -p evidence
          python3 - <<'PY'
          import urllib.request,pathlib,json,hashlib,datetime,concurrent.futures
          keys=['O-4AAOSwpB5mDzn8','WB4AAOSwO1xmDzn9','9gQAAOSwxbdmDzoC','f~MAAOSwjtVmDzoD','drUAAOSwOA9mDzoE','KQkAAOSwjmJmDzoE','UDoAAOSwRdhmDzoF']
          def run(k):
            url='https://i.ebayimg.com/images/g/'+k+'/s-l1600.webp';r={'url':url,'publisher':'Maloneys Mercantile on eBay','parentPage':'https://www.ebay.com/itm/365881672541','tier':'owner photographs; exact mold identity must be compared','retrievedUTC':datetime.datetime.now(datetime.timezone.utc).isoformat()}
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as f:d=f.read();r.update(mime=f.headers.get('Content-Type'),status=f.status)
              n=k+'.webp';pathlib.Path('evidence',n).write_bytes(d);r.update(file=n,sha256=hashlib.sha256(d).hexdigest(),bytes=len(d))
            except Exception as e:r['error']=str(e)
            return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:rs=list(ex.map(run,keys))
          pathlib.Path('evidence/retrieval-manifest.json').write_text(json.dumps(rs,indent=2));print(json.dumps(rs))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch04-ring-detail-originals
          path: evidence/
          retention-days: 7
