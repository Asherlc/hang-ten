name: Verify and publish simplification pilot
on:
  push:
    branches: [optimize/model-simplification-pilot-20260922]
    paths: [.github/workflows/model-simplification-publish.yml]
permissions:
  contents: write
concurrency:
  group: hang-ten-simplify-pilot-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: Tools/HangboardPackages/src:Tools/HangboardModels
      PILOT_BRANCH: optimize/model-simplification-pilot-20260922
      SCRATCH: .context/hang-ten-simplify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Load checksum-locked reviewed authoring sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCRATCH"
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,zlib
          chunks=['aa8a63cf4048217e4fb0dc6fa9e9110c9a4a951b','5d04cdd82bfd6bace5ae7ec7db4a79066760fa4d','ce9eb249171406ebb6ab0a22b5575ab30f5cfe13']
          raw=b''
          for sha in chunks:
              obj=json.loads(subprocess.check_output(['gh','api',f'repos/Asherlc/hang-ten/git/blobs/{sha}']))
              part=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(part)).encode()+b'\0'+part).hexdigest()==sha
              raw+=part
          assert hashlib.sha256(raw).hexdigest()=='cdd68f472b3c29ce8d2abb4371d4fc082b3d9bd3be6a83bc336ba6d614a1cb33'
          files=json.loads(zlib.decompress(raw));assert len(files)==8
          root=pathlib.Path.cwd()
          for name,text in files.items():
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name.startswith(('Tools/HangboardModels/','Tools/HangboardPackages/tests/','ReviewTools/','docs/source-audits/'))
              dest=root/p;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_text(text)
          (root/os.environ['SCRATCH']/'source-paths.json').write_text(json.dumps(list(files)))
          PY
      - name: Install pinned tools and compile verified meshoptimizer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r Tools/HangboardModels/simplification_requirements.txt pytest PyYAML
          mkdir -p .context/deps
          curl --fail --location --retry 2 https://codeload.github.com/zeux/meshoptimizer/tar.gz/refs/tags/v1.0 -o .context/deps/meshoptimizer.tar.gz
          echo '30d1c3651986b2074e847b17223a7269c9612ab7f148b944250f81214fed4993  .context/deps/meshoptimizer.tar.gz' | sha256sum -c -
          tar -xzf .context/deps/meshoptimizer.tar.gz -C .context/deps
          c++ -O3 -DNDEBUG -fPIC -shared .context/deps/meshoptimizer-1.0/src/*.cpp -o .context/deps/libmeshoptimizer.so
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || sudo apt-get install -y fonts-dejavu-core
      - name: Preserve baseline and generate selected and conservative candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCRATCH/before"
          cp -a Hangboards "$SCRATCH/before/"
          cp -a Tools "$SCRATCH/before/"
          python -m pytest Tools/HangboardModels -q | tee "$SCRATCH/model-tests.log"
          python Tools/HangboardModels/simplify_display_models.py --root . --output "$SCRATCH/selected" --manifest Tools/HangboardModels/simplification_pilot.json --profile lean | tee "$SCRATCH/generation.log"
          python Tools/HangboardModels/simplify_display_models.py --root . --output "$SCRATCH/conservative" --manifest Tools/HangboardModels/simplification_pilot.json --profile conservative | tee "$SCRATCH/conservative-generation.log"
      - name: Independently verify every selected exported mesh
        shell: bash
        run: |
          set -euo pipefail
          for board in metolius-simulator-3d metolius-wood-grips-deluxe-ii lattice-mxedge-lift-small; do
            python Tools/HangboardModels/verify_simplification_pilot.py --root . --output "$SCRATCH/selected" --board "$board" | tee "$SCRATCH/$board-validation.log"
          done
          python - <<'PY'
          import json,os,pathlib,shutil
          root=pathlib.Path.cwd();scratch=root/os.environ['SCRATCH']
          manifest=json.loads((root/'Tools/HangboardModels/simplification_pilot.json').read_text())
          for slug in manifest['models']:
              for name in ('primary.usdz','primary.model.json'):
                  rel=pathlib.Path('Hangboards')/slug/'assets'/name
                  shutil.copyfile(scratch/'selected'/rel,root/rel)
          for before in (scratch/'before/Hangboards').rglob('*'):
              if not before.is_file():continue
              rel=before.relative_to(scratch/'before')
              changed=rel.parts[1] in manifest['models'] and rel.name in ('primary.usdz','primary.model.json')
              if not changed:assert before.read_bytes()==(root/rel).read_bytes(),rel
          report={slug:json.loads((scratch/'selected/Verification'/f'{slug}.json').read_text()) for slug in manifest['models']}
          report['scope']={'optimizedModels':3,'unchangedModels':37,'allBoardMetadataUnchanged':True,'baseCommit':manifest['sourceCommit']}
          dest=root/'docs/source-audits/2026-09-22-model-simplification-verification.json'
          dest.write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Refresh verified candidate checksum before alignment tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,importlib.util,json,pathlib
          root=pathlib.Path.cwd()
          spec=importlib.util.spec_from_file_location('delivery',root/'scripts/verify-model-delivery.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          path=root/mod.LOCK_PATH;lock=json.loads(path.read_text())
          lock['sha256Manifest']=hashlib.sha256(mod.checksum_manifest(root,lock['modelPackages']).encode()).hexdigest()
          path.write_text(json.dumps(lock,indent=2)+'\n')
          mod.verify(root,lock)
          print('Candidate checksum verified; actual assetCommit is set only after committing assets.')
          PY
      - name: Run model and package suites
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest Tools/HangboardModels Tools/HangboardPackages/tests -q -rs | tee "$SCRATCH/model-package-tests.log"
          python -m hangboard_packages.cli validate --root Hangboards --final-inventory | tee "$SCRATCH/packages.log"
      - name: Commit exact exports and lock their delivery
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$PILOT_BRANCH"
          test "$(git ls-remote origin "refs/heads/$PILOT_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          python - <<'PY'
          import json,os,pathlib,subprocess
          scratch=pathlib.Path(os.environ['SCRATCH']);paths=json.loads((scratch/'source-paths.json').read_text())
          paths.append('docs/source-audits/2026-09-22-model-simplification-verification.json')
          manifest=json.loads(pathlib.Path('Tools/HangboardModels/simplification_pilot.json').read_text())
          paths.extend(f'Hangboards/{s}/assets/{n}' for s in manifest['models'] for n in ('primary.usdz','primary.model.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(paths)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(models): simplify three reviewed boards with protected topology'
          git rev-parse HEAD > "$SCRATCH/asset-commit.txt"
          python - <<'PY'
          import hashlib,importlib.util,json,pathlib,subprocess
          p=pathlib.Path('scripts/verify-model-delivery.py');spec=importlib.util.spec_from_file_location('delivery',p);mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          path=pathlib.Path(mod.LOCK_PATH);lock=json.loads(path.read_text());lock['assetCommit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          lock['authoritativeSource']='Committed simplification pilot exports; copy these bytes, never regenerate a delivery'
          lock['sha256Manifest']=hashlib.sha256(mod.checksum_manifest(pathlib.Path.cwd(),lock['modelPackages']).encode()).hexdigest()
          path.write_text(json.dumps(lock,indent=2)+'\n');mod.verify(pathlib.Path.cwd(),lock)
          PY
          git add docs/source-audits/2026-09-22-model-delivery-lock.json
          git commit -m 'test(models): lock all 40 delivery packages to committed pilot bytes'
          git lfs push origin HEAD
          git push origin "HEAD:refs/heads/$PILOT_BRANCH"
          git rev-parse HEAD > "$SCRATCH/published-commit.txt"
      - name: Copy committed models into delivery and render those same bytes
        shell: bash
        run: |
          set -euo pipefail
          export RENDER_COMMIT="$(cat "$SCRATCH/asset-commit.txt")"
          python - <<'PY'
          import json,os,pathlib,shutil
          root=pathlib.Path.cwd();scratch=root/os.environ['SCRATCH'];dest=scratch/'hang-ten-simplification-pilot'
          lock=json.loads((root/'docs/source-audits/2026-09-22-model-delivery-lock.json').read_text())
          for slug in lock['modelPackages']:
              shutil.copytree(root/'Hangboards'/slug,dest/'Hangboards'/slug)
          paths=json.loads((scratch/'source-paths.json').read_text())
          paths += ['scripts/verify-model-delivery.py','docs/source-audits/2026-09-22-model-delivery-lock.json','docs/source-audits/2026-09-22-model-simplification-verification.json']
          for name in paths:
              p=dest/name;p.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(root/name,p)
          for name in ['contact_model_descriptor.py','contact_model_package.py','remove_mounting_bores.py','verify_mounting_bores.py','mounting_bore_repairs.json']:
              shutil.copyfile(root/'Tools/HangboardModels'/name,dest/'Tools/HangboardModels'/name)
          shutil.copyfile(scratch/'selected/simplification-report.json',dest/'simplification-report.json')
          shutil.copytree(scratch/'conservative/Hangboards',dest/'Alternatives/Conservative/Hangboards')
          shutil.copyfile(scratch/'conservative/simplification-report.json',dest/'Alternatives/Conservative/simplification-report.json')
          shutil.copytree(scratch/'selected/Verification',dest/'Verification')
          (dest/'README.md').write_text('# Hang Ten simplification pilot\n\nThree optimized models; 37 unchanged. These 40 package trees are copied from committed pilot assets and verified by scripts/verify-model-delivery.py. Alternatives/Conservative contains optional comparison exports, not the selected runtime models. Previews are neutral CPU renders of these same USDZ bytes, not native app screenshots. Native iOS/SceneKit/Blender validation and broad shape redesign are not claimed. No merge is performed.\n')
          PY
          export RENDER_VARIANT='Selected pilot'
          python ReviewTools/render_simplification.py --root "$SCRATCH/hang-ten-simplification-pilot" --boards metolius-simulator-3d metolius-wood-grips-deluxe-ii lattice-mxedge-lift-small
          export RENDER_VARIANT='Before simplification'
          export RENDER_COMMIT=ef07a5fb04104d5f0a5ed3accc4c6ae918e02529
          python ReviewTools/render_simplification.py --root "$SCRATCH/before" --boards metolius-simulator-3d metolius-wood-grips-deluxe-ii lattice-mxedge-lift-small
          cp -a "$SCRATCH/before/Previews" "$SCRATCH/hang-ten-simplification-pilot/Previews-Before"
          export RENDER_VARIANT='Conservative comparison'
          export RENDER_COMMIT='Uncommitted comparison candidate from ef07a5fb'
          python ReviewTools/render_simplification.py --root "$SCRATCH/hang-ten-simplification-pilot/Alternatives/Conservative" --boards metolius-simulator-3d metolius-wood-grips-deluxe-ii lattice-mxedge-lift-small
          python scripts/verify-model-delivery.py --root "$SCRATCH/hang-ten-simplification-pilot" --report "$SCRATCH/hang-ten-simplification-pilot/Verification/exact-delivery.json"
          cp "$SCRATCH/"*.log "$SCRATCH/hang-ten-simplification-pilot/Verification/"
          cp "$SCRATCH/asset-commit.txt" "$SCRATCH/published-commit.txt" "$SCRATCH/hang-ten-simplification-pilot/Verification/"
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          scratch=pathlib.Path(os.environ['SCRATCH']);dest=scratch/'hang-ten-simplification-pilot'
          files=sorted(p for p in dest.rglob('*') if p.is_file())
          checks=''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(dest).as_posix()}\n' for p in files)
          (dest/'SHA256SUMS').write_text(checks)
          with zipfile.ZipFile(scratch/'hang-ten-simplification-pilot.zip','w',zipfile.ZIP_DEFLATED,compresslevel=5) as z:
              for p in sorted(dest.rglob('*')):
                  if p.is_file():z.write(p,p.relative_to(scratch))
          with zipfile.ZipFile(scratch/'hang-ten-simplification-pilot.zip') as z:
              assert z.testzip() is None
              for p in files:assert z.read(str(p.relative_to(scratch)))==p.read_bytes()
          print('Exact delivery ZIP verified.')
          PY
      - name: Upload exact delivery and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hang-ten-simplification-pilot-exact
          path: |
            .context/hang-ten-simplify/*.log
            .context/hang-ten-simplify/*.txt
            .context/hang-ten-simplify/hang-ten-simplification-pilot.zip
            .context/hang-ten-simplify/selected/
          include-hidden-files: true
          retention-days: 7
          compression-level: 0
