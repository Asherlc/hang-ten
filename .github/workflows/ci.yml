name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      python: ${{ steps.filter.outputs.python }}
      workbench_web: ${{ steps.filter.outputs.workbench_web }}
      workbench_native: ${{ steps.filter.outputs.workbench_native }}
      shared_board_content: ${{ steps.filter.outputs.shared_board_content }}
      metadata: ${{ steps.filter.outputs.metadata }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: .github/ci-paths.yml

  metadata:
    name: Validate App Store metadata
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.metadata == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.shared_board_content == 'true'
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate App Store metadata
        run: scripts/validate-app-store-metadata.sh

  python:
    name: Test (Python)
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.shared_board_content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Tools/HangboardWorkbench

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Tools/HangboardWorkbench/pyproject.toml

      - name: Install wheel-build prerequisites
        run: python -m pip install 'setuptools>=68' wheel

      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate direct board packages
        run: python -m pytest tests/test_board_package.py -q

      - name: Stage board packages into a temporary app resource root
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          resource_root="$RUNNER_TEMP/hang-ten-package-stage"
          TARGET_BUILD_DIR="$resource_root/build" \
          UNLOCALIZED_RESOURCES_FOLDER_PATH="Resources" \
          python3 scripts/stage-board-packages.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --destination "$resource_root/build/Resources/Hangboards"

      - name: Run pytest suite
        env:
          PYTHONPATH: ../HangboardPipeline/tests:../HangboardWorkbench/tests
        run: python -m pytest ../HangboardPipeline/tests/test_generated_catalog_import.py -q --junitxml=pytest-results.xml

      # actions/upload-artifact v4.6.2
      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-test-results-${{ github.run_id }}
          path: Tools/HangboardWorkbench/pytest-results.xml
          if-no-files-found: ignore

  build-ios:
    name: Build iOS (${{ matrix.name }})
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.ios == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.shared_board_content == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug simulator
            configuration: Debug
            sdk: iphonesimulator
            destination: generic/platform=iOS Simulator

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build ${{ matrix.name }}
        env:
          # Forked pull requests receive an empty secret; the app then uses its
          # intentional no-op telemetry composition.
          POSTHOG_CLIENT_TOKEN: ${{ secrets.POSTHOG_CLIENT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/hang-ten-build/${{ matrix.configuration }}-${{ matrix.sdk }}"
          mkdir -p "$RUNNER_TEMP/hang-ten-logs" "$build_root/sym" "$build_root/obj"
          telemetry_xcconfig="$(mktemp "$RUNNER_TEMP/hang-ten-posthog.XXXXXX")"
          trap 'rm -f "$telemetry_xcconfig"' EXIT
          umask 077
          case "$POSTHOG_HOST" in
            https://?*) posthog_host_remainder="${POSTHOG_HOST#https://}" ;;
            *) echo "POSTHOG_HOST must be a normal HTTPS URL" >&2; exit 1 ;;
          esac
          # `//` begins a comment in an xcconfig. Compose the second slash via
          # a build setting so the resolved value remains the full HTTPS URL.
          printf 'POSTHOG_URL_SLASH = /\nPOSTHOG_CLIENT_TOKEN = %s\nPOSTHOG_HOST = https:/$(POSTHOG_URL_SLASH)%s\n' \
            "$POSTHOG_CLIENT_TOKEN" "$posthog_host_remainder" > "$telemetry_xcconfig"
          chmod 600 "$telemetry_xcconfig"
          unset POSTHOG_CLIENT_TOKEN POSTHOG_HOST
          xcodebuild \
            -project HangTen.xcodeproj \
            -target HangTen \
            -configuration "${{ matrix.configuration }}" \
            -sdk "${{ matrix.sdk }}" \
            -destination "${{ matrix.destination }}" \
            SYMROOT="$build_root/sym" \
            OBJROOT="$build_root/obj" \
            -xcconfig "$telemetry_xcconfig" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/hang-ten-logs/${{ matrix.configuration }}-${{ matrix.sdk }}.log"

      # actions/upload-artifact v4.6.2
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-build-logs-${{ matrix.configuration }}-${{ matrix.sdk }}-${{ github.run_id }}
          path: ${{ runner.temp }}/hang-ten-logs/
          if-no-files-found: ignore

  build-required:
    # Keep this stable: branch protection requires this exact check name. A
    # matrix job skipped by path classification never creates its expanded
    # check name, leaving the pull request waiting forever.
    name: Build (Debug simulator)
    needs:
      - changes
      - build-ios
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report required build status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build-ios.result }}
          BUILD_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.shared_board_content == 'true' }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$BUILD_REQUIRED" == "true" ]]; then
            if [[ "$BUILD_RESULT" == "cancelled" ]]; then
              echo "Required iOS build was cancelled for this attempt; evaluating only non-cancelled runs."
              exit 0
            fi
            if [[ "$BUILD_RESULT" != "success" ]]; then
              echo "Required iOS build did not succeed: $BUILD_RESULT" >&2
              exit 1
            fi
            echo "Required iOS build succeeded."
          else
            if [[ "$BUILD_RESULT" != "skipped" ]]; then
              echo "Non-required iOS build had unexpected result: $BUILD_RESULT" >&2
              exit 1
            fi
            echo "iOS build is not required for the changed components."
          fi

  build-release-device:
    name: Build (Release device)
    needs:
      - changes
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Release device
        env:
          POSTHOG_CLIENT_TOKEN: ${{ secrets.POSTHOG_CLIENT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hang-ten-logs" "$RUNNER_TEMP/hang-ten-derived-data"
          telemetry_xcconfig="$(mktemp "$RUNNER_TEMP/hang-ten-posthog.XXXXXX")"
          trap 'rm -f "$telemetry_xcconfig"' EXIT
          umask 077
          case "$POSTHOG_HOST" in
            https://?*) posthog_host_remainder="${POSTHOG_HOST#https://}" ;;
            *) echo "POSTHOG_HOST must be a normal HTTPS URL" >&2; exit 1 ;;
          esac
          # `//` begins a comment in an xcconfig. Compose the second slash via
          # a build setting so the resolved value remains the full HTTPS URL.
          printf 'POSTHOG_URL_SLASH = /\nPOSTHOG_CLIENT_TOKEN = %s\nPOSTHOG_HOST = https:/$(POSTHOG_URL_SLASH)%s\n' \
            "$POSTHOG_CLIENT_TOKEN" "$posthog_host_remainder" > "$telemetry_xcconfig"
          chmod 600 "$telemetry_xcconfig"
          unset POSTHOG_CLIENT_TOKEN POSTHOG_HOST
          xcodebuild \
            -project HangTen.xcodeproj \
            -scheme HangTen \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/hang-ten-derived-data/Release-iphoneos" \
            -xcconfig "$telemetry_xcconfig" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/hang-ten-logs/Release-iphoneos.log"

      # actions/upload-artifact v4.6.2
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-build-logs-Release-iphoneos-${{ github.run_id }}
          path: ${{ runner.temp }}/hang-ten-logs/
          if-no-files-found: ignore

  test:
    name: Test (iOS Simulator)
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.ios == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.shared_board_content == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Create test simulator
        id: create-simulator
        run: |
          set -euo pipefail

          device_type_id="$(
            xcrun simctl list devicetypes \
              | sed -nE 's/^[[:space:]]*iPhone 16 \((com\.apple\.CoreSimulator\.SimDeviceType\.[^)]+)\).*$/\1/p' \
              | head -n 1
          )"
          if [[ -z "$device_type_id" ]]; then
            echo "Required iPhone 16 simulator device type is unavailable." >&2
            exit 1
          fi

          runtime_id="$(
            xcrun simctl list runtimes available \
              | awk '
                /^[[:space:]]*iOS [0-9]/ {
                  version = $2
                  runtime = $NF
                  if (runtime ~ /^com\.apple\.CoreSimulator\.SimRuntime\.iOS-/) {
                    print version "|" runtime
                  }
                }
              ' \
              | awk -F'|' '
                {
                  split($1, version, /\./)
                  printf "%03d%03d%03d|%s\n", version[1], version[2], version[3], $2
                }
              ' \
              | sort \
              | tail -n 1 \
              | cut -d'|' -f 2-
          )"
          if [[ -z "$runtime_id" ]]; then
            echo "No available iOS simulator runtime was found." >&2
            exit 1
          fi

          simulator_name="Hang Ten CI iPhone 16 $(uuidgen)"
          simulator_udid="$(xcrun simctl create "$simulator_name" "$device_type_id" "$runtime_id")"
          if [[ -z "$simulator_udid" ]]; then
            echo "Failed to create the owned iPhone 16 simulator." >&2
            exit 1
          fi

          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$simulator_udid"
          if ! timeout 90 xcrun simctl bootstatus "$simulator_udid" -b; then
            echo "Simulator boot status check timed out; continuing anyway." >&2
          fi

      - name: Run XCTest suite
        env:
          POSTHOG_CLIENT_TOKEN: ${{ secrets.POSTHOG_CLIENT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hang-ten-test-logs" "$RUNNER_TEMP/hang-ten-test-derived-data"
          telemetry_xcconfig="$(mktemp "$RUNNER_TEMP/hang-ten-posthog.XXXXXX")"
          trap 'rm -f "$telemetry_xcconfig"' EXIT
          umask 077
          case "$POSTHOG_HOST" in
            https://?*) posthog_host_remainder="${POSTHOG_HOST#https://}" ;;
            *) echo "POSTHOG_HOST must be a normal HTTPS URL" >&2; exit 1 ;;
          esac
          # `//` begins a comment in an xcconfig. Compose the second slash via
          # a build setting so the resolved value remains the full HTTPS URL.
          printf 'POSTHOG_URL_SLASH = /\nPOSTHOG_CLIENT_TOKEN = %s\nPOSTHOG_HOST = https:/$(POSTHOG_URL_SLASH)%s\n' \
            "$POSTHOG_CLIENT_TOKEN" "$posthog_host_remainder" > "$telemetry_xcconfig"
          chmod 600 "$telemetry_xcconfig"
          unset POSTHOG_CLIENT_TOKEN POSTHOG_HOST
          xcodebuild \
            -project HangTen.xcodeproj \
            -scheme HangTen \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.create-simulator.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -derivedDataPath "$RUNNER_TEMP/hang-ten-test-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/HangTenTests.xcresult" \
            -xcconfig "$telemetry_xcconfig" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-" \
            test 2>&1 | tee "$RUNNER_TEMP/hang-ten-test-logs/test.log"

      - name: Run board package-store tests
        run: |
          set -o pipefail
          xcodebuild \
            -project HangTen.xcodeproj \
            -scheme HangTen \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.create-simulator.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -derivedDataPath "$RUNNER_TEMP/hang-ten-package-test-derived-data" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-" \
            -only-testing:HangTenTests/BoardPackageStoreTests \
            test 2>&1 | tee "$RUNNER_TEMP/hang-ten-test-logs/package-store.log"

      # actions/upload-artifact v4.6.2
      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-test-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/HangTenTests.xcresult
            ${{ runner.temp }}/hang-ten-test-logs/
          if-no-files-found: ignore

      - name: Verify simulator HealthKit entitlement
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d "$RUNNER_TEMP/hang-ten-test-derived-data" ]]; then
            echo "Simulator test derived data was not generated." >&2
            exit 1
          fi
          entitlements_path="$(
            find "$RUNNER_TEMP/hang-ten-test-derived-data" \
              -type f \
              -name 'HangTen.app-Simulated.xcent' \
              -print \
              -quit
          )"
          if [[ -z "$entitlements_path" ]]; then
            echo "Simulator HealthKit entitlements were not generated." >&2
            exit 1
          fi
          healthkit_enabled="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :com.apple.developer.healthkit' \
              "$entitlements_path"
          )"
          if [[ "$healthkit_enabled" != "true" ]]; then
            echo "Simulator HealthKit entitlement must be true; found: $healthkit_enabled" >&2
            exit 1
          fi

      - name: Delete test simulator
        if: always()
        env:
          SIMULATOR_UDID: ${{ steps.create-simulator.outputs.udid }}
        run: |
          set -euo pipefail
          if [[ -n "$SIMULATOR_UDID" ]]; then
            xcrun simctl delete "$SIMULATOR_UDID"
          fi
