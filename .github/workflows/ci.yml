        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$BUILD_REQUIRED" == "true" ]]; then
            if [[ "$PAYWALL_RESULT" != "success" ]] || [[ "$MAP_RESULT" != "success" ]]; then
              echo "Required UI test shards did not succeed: paywall=$PAYWALL_RESULT map=$MAP_RESULT" >&2
              exit 1
            fi
            echo "Required UI test shards succeeded."
          else
            if [[ "$PAYWALL_RESULT" != "skipped" ]] || [[ "$MAP_RESULT" != "skipped" ]]; then
              echo "Non-required UI test shards had unexpected results: paywall=$PAYWALL_RESULT map=$MAP_RESULT" >&2
              exit 1
            fi
            echo "UI tests are not required for the changed components."
          fi
