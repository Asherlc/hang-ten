              HangTenUITests/OneHandedHandChoiceUITests
              HangTenUITests/BeastmakerBoardPickerInteractionUITests
              HangTenUITests/BoardPickerUITests
    timeout-minutes: 70

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true

      - name: Restore compiled board catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.board-assets.outputs.artifact-name }}
          path: .

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Capture Xcode version for DerivedData cache key
        run: |
          set -euo pipefail
          mkdir -p .context
          xcodebuild -version | tee .context/ci-xcode-version.txt

      # actions/cache/restore v4.2.3
      - name: Restore Xcode DerivedData
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-ui-test-derived-data
          key: deriveddata-${{ runner.os }}-${{ runner.arch }}-HangTenUITests-map-${{ matrix.shard }}-${{ hashFiles('.context/ci-xcode-version.txt') }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ runner.arch }}-HangTenUITests-map-${{ matrix.shard }}-${{ hashFiles('.context/ci-xcode-version.txt') }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Ensure Metal compiler is available
        run: |
          set -euo pipefail
          if xcrun metal -v; then
            exit 0
          fi

          # Downloading installs the asset, but xcrun can still select Xcode's
          # placeholder compiler. Resolve and select the installed component.
          xcodebuild -downloadComponent MetalToolchain
          metal_identifier="$(xcodebuild -showComponent MetalToolchain -json | python3 -c '
          import json, sys
          component = json.load(sys.stdin)
          identifier = component.get("toolchainIdentifier", "")
          if component.get("status") != "installed" or not identifier.startswith("com.apple.dt.toolchain.Metal."):
              raise SystemExit("Xcode did not report an installed Metal toolchain identifier")
          if any(character.isspace() for character in identifier):
              raise SystemExit("Invalid Metal toolchain identifier")
          print(identifier)
          ')"
          export TOOLCHAINS="$metal_identifier,com.apple.dt.toolchain.XcodeDefault"
          xcrun --kill-cache
          xcrun metal -v
          xcrun swift --version
          # xcodebuild does not honor xcrun's TOOLCHAINS environment selection;
          # the test runner must also pass the explicit -toolchain argument.
          printf 'XCTEST_TOOLCHAIN=%s\n' "$metal_identifier" >> "$GITHUB_ENV"

      - name: Select latest available iOS Pro simulator for the board comparison
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list --json | python3 -c '
          import json
          import os
          import re
          import sys

          inventory = json.load(sys.stdin)
          candidates = []
          for runtime in inventory.get("runtimes", []):
              if not runtime.get("isAvailable", False) or runtime.get("platform") != "iOS":
                  continue
              version = tuple(int(part) for part in runtime["version"].split("."))
              for device in inventory.get("devices", {}).get(runtime["identifier"], []):
                  match = re.search(r"\.iPhone-(\d+)-Pro$", device.get("deviceTypeIdentifier", ""))
                  if device.get("isAvailable", False) and match:
                      candidates.append((version, int(match[1]), device["udid"], runtime, device))
          if not candidates:
              raise SystemExit("No available iOS iPhone Pro simulator in runner inventory")
          _, _, _, runtime, device = max(candidates, key=lambda candidate: candidate[:3])
          destination = "platform=iOS Simulator,id=" + device["udid"]
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write("XCTEST_DESTINATION=" + destination + "\n")
          identifier = runtime["identifier"]
          runtime_version = runtime["version"]
          device_name = device["name"]
          print(f"Board comparison selected: {identifier}; version={runtime_version}; device={device_name}; {destination}")
          '

      - name: Run XCTest suite
        id: xctest
        env:
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}
