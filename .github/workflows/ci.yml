  test-ui:
    # Keep this stable: branch ruleset "Main" requires this exact check name.
    # Shard display names can differ; this aggregator is the required context.
    name: "Test (iOS Simulator: HangTenUITests)"
    needs:
      - changes
      - test-ui-paywall
      - test-ui-map
      - test-ui-grip
      - test-ui-picker
      - test-ui-misc
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Report required UI test status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PAYWALL_RESULT: ${{ needs.test-ui-paywall.result }}
          MAP_RESULT: ${{ needs.test-ui-map.result }}
          GRIP_RESULT: ${{ needs.test-ui-grip.result }}
          PICKER_RESULT: ${{ needs.test-ui-picker.result }}
          MISC_RESULT: ${{ needs.test-ui-misc.result }}
          BUILD_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" == "cancelled" ]]; then
            echo "Change classification was cancelled for this attempt; evaluating only non-cancelled runs."
            exit 0
          fi
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$BUILD_REQUIRED" == "true" ]]; then
            # Prefer failure over cancelled so a failed shard is not masked when
            # a sibling is cancelled mid-run.
            if [[ "$PAYWALL_RESULT" == "failure" || "$MAP_RESULT" == "failure" || "$GRIP_RESULT" == "failure" || "$PICKER_RESULT" == "failure" || "$MISC_RESULT" == "failure" ]]; then
              echo "Required UI test shard failed: paywall=$PAYWALL_RESULT map=$MAP_RESULT grip=$GRIP_RESULT picker=$PICKER_RESULT misc=$MISC_RESULT" >&2
              exit 1
            fi
            if [[ "$PAYWALL_RESULT" == "cancelled" || "$MAP_RESULT" == "cancelled" || "$GRIP_RESULT" == "cancelled" || "$PICKER_RESULT" == "cancelled" || "$MISC_RESULT" == "cancelled" ]]; then
              echo "Required UI test shard was cancelled for this attempt; evaluating only non-cancelled runs."
              exit 0
            fi
            if [[ "$PAYWALL_RESULT" != "success" ]] || [[ "$MAP_RESULT" != "success" ]] || [[ "$GRIP_RESULT" != "success" ]] || [[ "$PICKER_RESULT" != "success" ]] || [[ "$MISC_RESULT" != "success" ]]; then
              echo "Required UI test shards did not succeed: paywall=$PAYWALL_RESULT map=$MAP_RESULT grip=$GRIP_RESULT picker=$PICKER_RESULT misc=$MISC_RESULT" >&2
              exit 1
            fi
            echo "Required UI test shards succeeded."
          else
            if [[ "$PAYWALL_RESULT" != "skipped" ]] || [[ "$MAP_RESULT" != "skipped" ]] || [[ "$GRIP_RESULT" != "skipped" ]] || [[ "$PICKER_RESULT" != "skipped" ]] || [[ "$MISC_RESULT" != "skipped" ]]; then
              echo "Non-required UI test shards had unexpected results: paywall=$PAYWALL_RESULT map=$MAP_RESULT grip=$GRIP_RESULT picker=$PICKER_RESULT misc=$MISC_RESULT" >&2
              exit 1
            fi
            echo "UI tests are not required for the changed components."
          fi
