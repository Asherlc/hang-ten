              HangTenUITests/IronPalmBoardMapInteractionUITests
              HangTenUITests/Batch05BoardModelInteractionUITests/testNatural
              HangTenUITests/Batch05BoardModelInteractionUITests/testPro
              HangTenUITests/Batch05BoardModelInteractionUITests/testForge
              HangTenUITests/OwlClimbPokerBoardMapInteractionUITests
              HangTenUITests/GripCueDiagnosticScreenshotUITests
              HangTenUITests/DefaultGripFingersUITests
              HangTenUITests/DualMaxHangsHighlightUITests
