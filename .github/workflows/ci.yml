name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed components
    # Closing (or merging) a pull request only needs to enter the
    # concurrency group above so it cancels any stale runs still queued or
    # in progress for this ref; it does no other work.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      python: ${{ steps.filter.outputs.python }}
      workbench_web: ${{ steps.filter.outputs.workbench_web }}
      workbench_native: ${{ steps.filter.outputs.workbench_native }}
      shared_board_content: ${{ steps.filter.outputs.shared_board_content }}
      metadata: ${{ steps.filter.outputs.metadata }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: .github/ci-paths.yml

  metadata:
    name: Validate App Store metadata
    needs:
      - changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.metadata == 'true' &&
      needs.changes.outputs.ios != 'true' &&
      needs.changes.outputs.workflow != 'true' &&
      needs.changes.outputs.shared_board_content != 'true'
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Validate App Store metadata
        env:
          SWIFT_PACKAGE_CACHE_PATH: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
        run: scripts/validate-app-store-metadata.sh

  python:
    name: Test (Python)
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.shared_board_content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Tools/HangboardPipeline

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Tools/HangboardPipeline/pyproject.toml

      # astral-sh/setup-uv v6
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff

      - name: Validate canonical board packages
        working-directory: ${{ github.workspace }}
        run: scripts/hangboard-tools.sh packages validate --root Hangboards

      - name: Install wheel-build prerequisites
        run: python -m pip install 'setuptools>=68' wheel

      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Stage board packages into a temporary app resource root
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          resource_root="$RUNNER_TEMP/hang-ten-package-stage"
          TARGET_BUILD_DIR="$resource_root/build" \
          UNLOCALIZED_RESOURCES_FOLDER_PATH="Resources" \
          python3 scripts/stage-board-packages.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --destination "$resource_root/build/Resources/Hangboards"

      - name: Run pytest suite
        run: python -m pytest tests -q --junitxml=pytest-results.xml

      # actions/upload-artifact v4.6.2
      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-test-results-${{ github.run_id }}
          path: Tools/HangboardPipeline/pytest-results.xml
          if-no-files-found: ignore

  build-required:
    # Keep this stable: branch protection requires this exact check name. A
    # test job skipped by path classification is reported here so this stable
    # check does not leave the pull request waiting forever.
    name: Build (Debug simulator)
    needs:
      - changes
      - test
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Report required build status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.test.result }}
          BUILD_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.shared_board_content == 'true' }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" == "cancelled" ]]; then
            echo "Change classification was cancelled for this attempt; evaluating only non-cancelled runs."
            exit 0
          fi
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$BUILD_REQUIRED" == "true" ]]; then
            if [[ "$BUILD_RESULT" == "cancelled" ]]; then
              echo "Required iOS test was cancelled for this attempt; evaluating only non-cancelled runs."
              exit 0
            fi
            if [[ "$BUILD_RESULT" != "success" ]]; then
              echo "Required iOS test did not succeed: $BUILD_RESULT" >&2
              exit 1
            fi
            echo "Required iOS test succeeded."
          else
            if [[ "$BUILD_RESULT" != "skipped" ]]; then
              echo "Non-required iOS test had unexpected result: $BUILD_RESULT" >&2
              exit 1
            fi
            echo "iOS test is not required for the changed components."
          fi

  build-release-device:
    name: Build (Release device)
    needs:
      - changes
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Release device
        env:
          POSTHOG_CLIENT_TOKEN: ${{ secrets.POSTHOG_CLIENT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hang-ten-logs" "$RUNNER_TEMP/hang-ten-derived-data"
          telemetry_xcconfig="$(mktemp "$RUNNER_TEMP/hang-ten-posthog.XXXXXX")"
          trap 'rm -f "$telemetry_xcconfig"' EXIT
          umask 077
          case "$POSTHOG_HOST" in
            https://?*) posthog_host_remainder="${POSTHOG_HOST#https://}" ;;
            *) echo "POSTHOG_HOST must be a normal HTTPS URL" >&2; exit 1 ;;
          esac
          # `//` begins a comment in an xcconfig. Compose the second slash via
          # a build setting so the resolved value remains the full HTTPS URL.
          printf 'POSTHOG_URL_SLASH = /\nPOSTHOG_CLIENT_TOKEN = %s\nPOSTHOG_HOST = https:/$(POSTHOG_URL_SLASH)%s\n' \
            "$POSTHOG_CLIENT_TOKEN" "$posthog_host_remainder" > "$telemetry_xcconfig"
          chmod 600 "$telemetry_xcconfig"
          unset POSTHOG_CLIENT_TOKEN POSTHOG_HOST
          xcodebuild \
            -project HangTen.xcodeproj \
            -scheme HangTen \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/hang-ten-derived-data/Release-iphoneos" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/hang-ten-swiftpm-source-packages" \
            -showBuildTimingSummary \
            -xcconfig "$telemetry_xcconfig" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/hang-ten-logs/Release-iphoneos.log"

      # actions/upload-artifact v4.6.2
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-build-logs-Release-iphoneos-${{ github.run_id }}
          path: ${{ runner.temp }}/hang-ten-logs/
          if-no-files-found: ignore

  test:
    name: Test (iOS Simulator)
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.ios == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.shared_board_content == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate App Store metadata
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.metadata == 'true' ||
          needs.changes.outputs.workflow == 'true' ||
          needs.changes.outputs.shared_board_content == 'true'
        env:
          SWIFT_PACKAGE_CACHE_PATH: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
        run: scripts/validate-app-store-metadata.sh

      - name: Run XCTest suite
        env:
          POSTHOG_CLIENT_TOKEN: ${{ secrets.POSTHOG_CLIENT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hang-ten-test-logs" "$RUNNER_TEMP/hang-ten-test-derived-data"
          telemetry_xcconfig="$(mktemp "$RUNNER_TEMP/hang-ten-posthog.XXXXXX")"
          trap 'rm -f "$telemetry_xcconfig"' EXIT
          umask 077
          case "$POSTHOG_HOST" in
            https://?*) posthog_host_remainder="${POSTHOG_HOST#https://}" ;;
            *) echo "POSTHOG_HOST must be a normal HTTPS URL" >&2; exit 1 ;;
          esac
          # `//` begins a comment in an xcconfig. Compose the second slash via
          # a build setting so the resolved value remains the full HTTPS URL.
          printf 'POSTHOG_URL_SLASH = /\nPOSTHOG_CLIENT_TOKEN = %s\nPOSTHOG_HOST = https:/$(POSTHOG_URL_SLASH)%s\n' \
            "$POSTHOG_CLIENT_TOKEN" "$posthog_host_remainder" > "$telemetry_xcconfig"
          chmod 600 "$telemetry_xcconfig"
          unset POSTHOG_CLIENT_TOKEN POSTHOG_HOST
          xcodebuild \
            -project HangTen.xcodeproj \
            -scheme HangTen \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=latest" \
            -parallel-testing-enabled YES \
            -maximum-parallel-testing-workers 1 \
            -derivedDataPath "$RUNNER_TEMP/hang-ten-test-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/HangTenTests.xcresult" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/hang-ten-swiftpm-source-packages" \
            -showBuildTimingSummary \
            -xcconfig "$telemetry_xcconfig" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-" \
            test 2>&1 | tee "$RUNNER_TEMP/hang-ten-test-logs/test.log"

      # actions/upload-artifact v4.6.2
      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-test-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/HangTenTests.xcresult
            ${{ runner.temp }}/hang-ten-test-logs/
          if-no-files-found: ignore

      - name: Verify simulator HealthKit entitlement
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d "$RUNNER_TEMP/hang-ten-test-derived-data" ]]; then
            echo "Simulator test derived data was not generated." >&2
            exit 1
          fi
          entitlements_path="$(
            find "$RUNNER_TEMP/hang-ten-test-derived-data" \
              -type f \
              -name 'HangTen.app-Simulated.xcent' \
              -print \
              -quit
          )"
          if [[ -z "$entitlements_path" ]]; then
            echo "Simulator HealthKit entitlements were not generated." >&2
            exit 1
          fi
          healthkit_enabled="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :com.apple.developer.healthkit' \
              "$entitlements_path"
          )"
          if [[ "$healthkit_enabled" != "true" ]]; then
            echo "Simulator HealthKit entitlement must be true; found: $healthkit_enabled" >&2
            exit 1
          fi
