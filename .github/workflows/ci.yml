name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Preserve running main builds so completed CI can promote tested commits.
  # GitHub retains only the newest pending run in each concurrency group.
  # Superseded PR revisions can stop their own checks without affecting main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changed components
    # Closing (or merging) a pull request only needs to enter its distinct,
    # event-specific concurrency group, so a merged PR's pull_request.closed
    # event cannot cancel the merge push CI; it does no other work.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cad: ${{ steps.filter.outputs.cad }}
      ios: ${{ steps.filter.outputs.ios }}
      python: ${{ steps.filter.outputs.python }}
      shared_board_content: ${{ steps.filter.outputs.shared_board_content }}
      metadata: ${{ steps.filter.outputs.metadata }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: .github/ci-paths.yml

  metadata:
    name: Validate App Store metadata
    needs:
      - changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.metadata == 'true' &&
      needs.changes.outputs.ios != 'true' &&
      needs.changes.outputs.workflow != 'true' &&
      needs.changes.outputs.shared_board_content != 'true'
    # Validates resolved Debug/Release build settings with xcodebuild.
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Validate App Store metadata
        env:
          SWIFT_PACKAGE_CACHE_PATH: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
        run: scripts/validate-app-store-metadata.sh

  board-assets:
    name: Compile runtime assets
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.ios == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.cad == 'true' ||
      needs.changes.outputs.shared_board_content == 'true' ||
      needs.changes.outputs.workflow == 'true'
    uses: ./.github/workflows/runtime-assets.yml
    with:
      source-ref: ${{ github.sha }}

  python:
    name: Test (Python)
    needs:
      - changes
      - board-assets
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.shared_board_content == 'true' ||
      needs.changes.outputs.cad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Tools/HangboardPackages

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true

      # actions/setup-python v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Tools/HangboardPackages/pyproject.toml

      - name: Restore compiled board catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.board-assets.outputs.artifact-name }}
          path: .

      - name: Validate canonical board packages
        working-directory: ${{ github.workspace }}
        run: scripts/hangboard-packages.sh validate --root Hangboards --final-inventory

      # CAD-backed boards do not commit board.json: it is generated at build
      # time from the FCStd's HangTenBoardManifest (pure host Python, no
      # FreeCAD). The validator above already generated and validated each one
      # (and rejects an on-disk copy); this names each generated document so a
      # failure points at the source. It needs the LFS objects, not pointers.
      - name: Generate board.json for CAD-backed boards
        working-directory: ${{ github.workspace }}
        run: python3 Tools/HangboardCAD/board_manifest.py --all

      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[dev]" numpy==2.2.6 usd-core==26.8

      - name: Stage board packages into a temporary app resource root
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          resource_root="$RUNNER_TEMP/hang-ten-package-stage"
          TARGET_BUILD_DIR="$resource_root/build" \
          UNLOCALIZED_RESOURCES_FOLDER_PATH="Resources" \
          DERIVED_FILE_DIR="$resource_root/DerivedFiles" \
          python3 scripts/stage-board-packages.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --destination "$resource_root/build/Resources/Hangboards"
          python3 Tools/HangboardCAD/board_manifest.py --all --output-dir "$resource_root/generated"
          for generated in "$resource_root"/generated/*/board.json; do
            slug=$(basename "$(dirname "$generated")")
            cmp "$generated" "$resource_root/build/Resources/Hangboards/$slug/board.json"
          done
          if find "$resource_root/build" -name '*.FCStd' | grep -q .; then
            echo "error: a CAD authoring source was staged into the app bundle" >&2
            exit 1
          fi

      - name: Stage board packages as the Android build does
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          asset_root="$RUNNER_TEMP/hang-ten-android-stage"
          scripts/run-supported-python.sh scripts/stage-board-packages.py \
            --target android \
            --repository-root "$GITHUB_WORKSPACE" \
            --destination "$asset_root/Hangboards"
          for source in Hangboards/*.FCStd; do
            slug=$(basename "$source" .FCStd)
            test -s "$asset_root/Hangboards/$slug/board.json"
            test -s "$asset_root/Hangboards/$slug/assets/primary.usdz"
          done
          if find "$asset_root" -name '*.FCStd' | grep -q .; then
            echo "error: a CAD authoring source was staged into the Android assets" >&2
            exit 1
          fi

      - name: Run pytest suite
        run: python -m pytest tests ../HangboardModels -q --junitxml=pytest-results.xml

      - name: Validate original routine prescriptions
        working-directory: ${{ github.workspace }}
        run: python3 scripts/tests/test_original_routine_sources.py

      - name: Run CAD board-manifest and source-contract tests
        if: ${{ !cancelled() }}
        run: >-
          python -m pytest
          ../HangboardCAD/tests/test_board_manifest.py
          ../HangboardCAD/tests/test_embedded_authoring.py
          ../HangboardCAD/tests/test_prepare_assets.py
          ../HangboardCAD/tests/test_freecad_launcher.py
          ../HangboardCAD/tests/test_runtime_asset_catalog.py
          ../../scripts/tests/test_runtime_catalog_selection.py
          ../../scripts/tests/test_cad_ci_dependencies.py
          ../HangboardCAD/tests/test_compile_suspension.py
          ../HangboardCAD/tests/test_cad_consumers.py
          ../HangboardCAD/tests/test_cad_sidecars.py
          ../HangboardCAD/tests/test_contract.py
          ../HangboardCAD/tests/test_whetstone_package.py
          ../HangboardCAD/tests/test_transgression_packages.py
          ../HangboardCAD/tests/test_confirmed_cord_diameter.py
          -k "not test_native_edits_keep_all_contacts_on_the_body"
          -q
          --junitxml=pytest-cad-results.xml

      # actions/upload-artifact v4.6.2
      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-test-results-${{ github.run_id }}
          path: |
            Tools/HangboardPackages/pytest-results.xml
            Tools/HangboardPackages/pytest-cad-results.xml
          if-no-files-found: ignore

  transgression-native:
    name: Test (Transgression native CAD)
    needs:
      - changes
      - board-assets
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.cad == 'true' ||
      needs.changes.outputs.workflow == 'true'
    # Native CAD uses FreeCAD/OpenUSD, with no Apple SDK dependency.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true

      - name: Restore compiled board catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.board-assets.outputs.artifact-name }}
          path: .

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install headless native CAD system libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libglu1-mesa libopengl0 squashfs-tools

      - name: Run native CAD, cord and YY persisted-edit regressions
        run: |
          set -euo pipefail
          owner=$(basename "${PASEO_WORKTREE_PATH:-$PWD}")
          cad_root="$PWD/.context/$owner-transgression-native-ci"
          if [[ -e "$cad_root" ]]; then
            echo "error: refusing to reuse an existing native CAD toolchain directory: $cad_root" >&2
            exit 1
          fi
          mkdir -p "$cad_root"
          # Record ownership before installing the extracted AppImage and USD staging.
          printf '%s\n' "$cad_root" "$cad_root/freecad" "$cad_root/usd" > "$cad_root/owned-resources"
          cleanup_cad() {
            local result=$?
            trap - EXIT
            rm -rf "$cad_root"
            if [[ -e "$cad_root" ]]; then
              echo "error: workspace-owned native CAD toolchain was not removed: $cad_root" >&2
              exit 1
            fi
            return "$result"
          }
          trap cleanup_cad EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          HANGTEN_FREECAD_CMD=$(scripts/install-freecad.sh "$cad_root/freecad")
          export HANGTEN_FREECAD_CMD
          export QT_QPA_PLATFORM=offscreen
          export HANGTEN_REQUIRE_NATIVE_CAD=true
          # Preserve upstream cord-regression pins alongside owned USD compiler staging.
          install_native_dependencies() {
            local attempt="$1"
            shift
            python -m pip install "$@" -e 'Tools/HangboardPackages[dev]' \
              numpy==2.2.6 usd-core==26.8 trimesh==5.1.0 shapely==2.1.2 rtree==1.4.1 scipy==1.16.3 networkx==3.6.1 \
              2>&1 | tee "$cad_root/dependencies-attempt-$attempt.log"
          }
          if ! install_native_dependencies 1; then
            # A hosted runner returned EIO while writing installed packages.
            # Recover only this setup error, replacing any partial installation.
            if ! grep -Fq 'OSError: [Errno 5] Input/output error' "$cad_root/dependencies-attempt-1.log"; then
              exit 1
            fi
            echo "Dependency installation hit EIO; reinstalling once before any tests run."
            install_native_dependencies 2 --force-reinstall
          fi
          python -m pip install --target "$cad_root/usd" 'usd-core==26.8'
          export HANGTEN_CAD_PYTHONPATH="$cad_root/usd"
          # Fail instead of silently skipping the required native checks.
          test -f "$HANGTEN_FREECAD_CMD"
          test -x "$HANGTEN_FREECAD_CMD"
          test -f "$HANGTEN_CAD_PYTHONPATH/pxr/__init__.py"
          python -c 'import numpy, pxr, trimesh, shapely, rtree, scipy, networkx'
          python -m pytest \
            Tools/HangboardCAD/tests/test_transgression_packages.py \
            Tools/HangboardCAD/tests/test_clavellium_native.py \
            Tools/HangboardCAD/tests/test_confirmed_cord_diameter.py \
            Tools/HangboardCAD/tests/test_rope_physics_export.py \
            Tools/HangboardCAD/tests/test_native_pose_terminals.py \
            Tools/HangboardCAD/tests/test_solver_sidecar_dispatch.py \
            Tools/HangboardCAD/tests/test_native_cord_routes.py \
            Tools/HangboardCAD/tests/test_compile_v2_depths.py \
            Tools/HangboardCAD/tests/test_rectangular_channel_section.py \
            Tools/HangboardCAD/tests/test_verticalboards_native.py \
            Tools/HangboardCAD/tests/test_verticalboard_validation_reporting.py -q

      - name: Delete owned CAD toolchain
        if: always()
        run: |
          set -euo pipefail
          owner=$(basename "${PASEO_WORKTREE_PATH:-$PWD}")
          cad_root="$PWD/.context/$owner-transgression-native-ci"
          if [[ -e "$cad_root" ]]; then
            # Failsafe for a cancelled shell: delete only the exact recorded owner.
            test -f "$cad_root/owned-resources"
            grep -Fxq "$cad_root" "$cad_root/owned-resources"
            rm -rf "$cad_root"
          fi
          test ! -e "$cad_root"

  workflow-lint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # reviewdog/action-actionlint v1.73.2
      - name: Validate workflow syntax
        uses: reviewdog/action-actionlint@1129829fb3230509a1c9aa4e93cec2b234746a68
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: error

  build-required:
    # Keep this stable: branch protection requires this exact check name. A
    # test job skipped by path classification is reported here so this stable
    # check does not leave the pull request waiting forever. Depends on the
    # HangTenUITests aggregator (not shards) so the required check graph is
    # unchanged.
    name: Build (Debug simulator)
    needs:
      - changes
      - test-unit
      - test-ui
      - transgression-native
      - board-assets
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Report required build status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BOARD_ASSETS_RESULT: ${{ needs.board-assets.result }}
          BOARD_ASSETS_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.cad == 'true' || needs.changes.outputs.shared_board_content == 'true' || needs.changes.outputs.workflow == 'true' }}
          NATIVE_CAD_RESULT: ${{ needs.transgression-native.result }}
          NATIVE_CAD_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.cad == 'true' || needs.changes.outputs.workflow == 'true' }}
          UNIT_TEST_RESULT: ${{ needs.test-unit.result }}
          UI_TEST_RESULT: ${{ needs.test-ui.result }}
          BUILD_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true' || needs.changes.outputs.shared_board_content == 'true' || needs.changes.outputs.cad == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$BOARD_ASSETS_REQUIRED" == "true" && "$BOARD_ASSETS_RESULT" != "success" ]]; then
            echo "Board runtime compilation did not succeed: $BOARD_ASSETS_RESULT" >&2
            exit 1
          fi
          if [[ "$NATIVE_CAD_REQUIRED" == "true" && "$NATIVE_CAD_RESULT" != "success" ]]; then
            echo "Required native CAD tests did not succeed: $NATIVE_CAD_RESULT" >&2
            exit 1
          fi
          if [[ "$BUILD_REQUIRED" == "true" ]]; then
            if [[ "$UNIT_TEST_RESULT" != "success" ]] || [[ "$UI_TEST_RESULT" != "success" ]]; then
              echo "Required iOS test did not succeed: HangTenTests=$UNIT_TEST_RESULT HangTenUITests=$UI_TEST_RESULT" >&2
              exit 1
            fi
            echo "Required iOS tests succeeded."
          else
            # HangTenTests is path-gated and skipped when iOS is not required.
            # The HangTenUITests aggregator always runs (like this job) and
            # reports success only after confirming every UI group was skipped.
            if [[ "$UNIT_TEST_RESULT" != "skipped" ]]; then
              echo "Non-required HangTenTests had unexpected result: $UNIT_TEST_RESULT" >&2
              exit 1
            fi
            if [[ "$UI_TEST_RESULT" != "success" ]]; then
              echo "Non-required UI test aggregator did not succeed: HangTenUITests=$UI_TEST_RESULT" >&2
              exit 1
            fi
            echo "iOS tests are not required for the changed components."
          fi

  build-release-device:
    name: Build (Release device)
    needs:
      - changes
      - board-assets
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true

      - name: Restore compiled board catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.board-assets.outputs.artifact-name }}
          path: .

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Release device
        env:
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hang-ten-logs" "$RUNNER_TEMP/hang-ten-derived-data"
          telemetry_xcconfig="$(mktemp "$RUNNER_TEMP/hang-ten-analytics.XXXXXX")"
          trap 'rm -f "$telemetry_xcconfig"' EXIT
          umask 077
          printf 'ANALYTICS_API_KEY = %s\n' "$ANALYTICS_API_KEY" > "$telemetry_xcconfig"
          chmod 600 "$telemetry_xcconfig"
          unset ANALYTICS_API_KEY
          xcodebuild \
            -project HangTen.xcodeproj \
            -scheme HangTen \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/hang-ten-derived-data/Release-iphoneos" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/hang-ten-swiftpm-source-packages" \
            -showBuildTimingSummary \
            -xcconfig "$telemetry_xcconfig" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/hang-ten-logs/Release-iphoneos.log"

      # actions/upload-artifact v4.6.2
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-build-logs-Release-iphoneos-${{ github.run_id }}
          path: ${{ runner.temp }}/hang-ten-logs/
          if-no-files-found: ignore

  test-unit:
    name: "Test (iOS Simulator: HangTenTests)"
    needs:
      - changes
      - board-assets
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.ios == 'true' ||
      needs.changes.outputs.shared_board_content == 'true' ||
      needs.changes.outputs.cad == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: macos-26
    env:
      # Xcode 26.6 is the image default but its runner-image entry doesn't
      # install simulator runtimes. Use the preinstalled 26.5 runtime for
      # simulator tests; keep the release build on the image default.
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    # Allow headroom for result-bundle upload; XCTest runs once per shard.
    timeout-minutes: 70

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true

      - name: Restore compiled board catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.board-assets.outputs.artifact-name }}
          path: .

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Capture Xcode version for DerivedData cache key
        run: |
          set -euo pipefail
          mkdir -p .context
          xcodebuild -version | tee .context/ci-xcode-version.txt

      # actions/cache/restore v4.2.3
      # Suite name comes before Xcode/Package hashes so restore-keys cannot
      # accidentally hydrate unit DerivedData from a UITest cache (or vice versa).
      - name: Restore Xcode DerivedData
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-test-derived-data
          key: deriveddata-${{ runner.os }}-${{ runner.arch }}-HangTenTests-${{ hashFiles('.context/ci-xcode-version.txt') }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ runner.arch }}-HangTenTests-${{ hashFiles('.context/ci-xcode-version.txt') }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Validate App Store metadata
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.metadata == 'true' ||
          needs.changes.outputs.workflow == 'true' ||
          needs.changes.outputs.shared_board_content == 'true'
        env:
          SWIFT_PACKAGE_CACHE_PATH: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
        run: scripts/validate-app-store-metadata.sh

      - name: Validate App Store release versioning
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.workflow == 'true'
        run: scripts/tests/release-workflow-version-test.zsh

      - name: Run XCTest suite
        id: xctest
        env:
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}
          XCTEST_RUN_TIMEOUT_SECONDS: "1800"
          XCTEST_LABEL: HangTenTests
          XCTEST_DERIVED_DATA: ${{ runner.temp }}/hang-ten-test-derived-data
          XCTEST_LOG_ROOT: ${{ runner.temp }}/hang-ten-test-logs
          XCTEST_RESULT_ROOT: ${{ runner.temp }}
          XCTEST_ONLY_TESTING: HangTenTests
          XCTEST_PARALLEL_WORKERS: "1"
          SWIFT_PACKAGE_CACHE_PATH: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
        run: |
          set -euo pipefail
          mkdir -p "$XCTEST_DERIVED_DATA" "$XCTEST_LOG_ROOT"
          telemetry_xcconfig="$(mktemp "$RUNNER_TEMP/hang-ten-analytics.XXXXXX")"
          trap 'rm -f "$telemetry_xcconfig"' EXIT
          umask 077
          printf 'ANALYTICS_API_KEY = %s\n' "$ANALYTICS_API_KEY" > "$telemetry_xcconfig"
          # Keep DEBUG, testability and Swift assertions, and run numerical physics
          # suite with optimization; unoptimized settling exhausts the run budget.
          # Xcode expands the literal $(inherited) from the xcconfig.
          # shellcheck disable=SC2016
          printf 'SWIFT_OPTIMIZATION_LEVEL = -O\nOTHER_SWIFT_FLAGS = $(inherited) -assert-config Debug\n' >> "$telemetry_xcconfig"
          chmod 600 "$telemetry_xcconfig"
          unset ANALYTICS_API_KEY
          XCTEST_XCCONFIG="$telemetry_xcconfig" scripts/ci-run-xctest.sh

      # actions/upload-artifact v4.6.2
      - name: Upload test diagnostics on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-test-results-HangTenTests-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/HangTenTests-run.xcresult
            ${{ runner.temp }}/hang-ten-test-logs/
          if-no-files-found: ignore

      - name: Verify simulator HealthKit entitlement
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d "$RUNNER_TEMP/hang-ten-test-derived-data" ]]; then
            echo "Simulator test derived data was not generated." >&2
            exit 1
          fi
          entitlements_path="$(
            find "$RUNNER_TEMP/hang-ten-test-derived-data" \
              -type f \
              -name 'HangTen.app-Simulated.xcent' \
              -print \
              -quit
          )"
          if [[ -z "$entitlements_path" ]]; then
            echo "Simulator HealthKit entitlements were not generated." >&2
            exit 1
          fi
          healthkit_enabled="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :com.apple.developer.healthkit' \
              "$entitlements_path"
          )"
          if [[ "$healthkit_enabled" != "true" ]]; then
            echo "Simulator HealthKit entitlement must be true; found: $healthkit_enabled" >&2
            exit 1
          fi

      # actions/cache/save v4.2.3
      # Save only on success so failed builds cannot poison DerivedData.
      - name: Save Xcode DerivedData
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-test-derived-data
          key: deriveddata-${{ runner.os }}-${{ runner.arch }}-HangTenTests-${{ hashFiles('.context/ci-xcode-version.txt') }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}

