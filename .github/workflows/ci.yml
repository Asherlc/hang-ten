name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed components
    # Closing (or merging) a pull request only needs to enter its distinct,
    # event-specific concurrency group, so a merged PR's pull_request.closed
    # event cannot cancel the merge push CI; it does no other work.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cad: ${{ steps.filter.outputs.cad }}
      ios: ${{ steps.filter.outputs.ios }}
      python: ${{ steps.filter.outputs.python }}
      shared_board_content: ${{ steps.filter.outputs.shared_board_content }}
      metadata: ${{ steps.filter.outputs.metadata }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: .github/ci-paths.yml

  metadata:
    name: Validate App Store metadata
    needs:
      - changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.metadata == 'true' &&
      needs.changes.outputs.ios != 'true' &&
      needs.changes.outputs.workflow != 'true' &&
      needs.changes.outputs.shared_board_content != 'true'
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Validate App Store metadata
        env:
          SWIFT_PACKAGE_CACHE_PATH: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
        run: scripts/validate-app-store-metadata.sh

  python:
    name: Test (Python)
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.shared_board_content == 'true' ||
      needs.changes.outputs.cad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Tools/HangboardPackages

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true

      # actions/setup-python v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Tools/HangboardPackages/pyproject.toml

      - name: Validate canonical board packages
        working-directory: ${{ github.workspace }}
        run: scripts/hangboard-packages.sh validate --root Hangboards --final-inventory

      # CAD-backed boards do not commit board.json: it is generated at build
      # time from the FCStd's HangTenBoardManifest (pure host Python, no
      # FreeCAD). The validator above already generated and validated each one
      # (and rejects an on-disk copy); this names each generated document so a
      # failure points at the source. It needs the LFS objects, not pointers.
      - name: Generate board.json for CAD-backed boards
        working-directory: ${{ github.workspace }}
        run: python3 Tools/HangboardCAD/board_manifest.py --all

      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Stage board packages into a temporary app resource root
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          resource_root="$RUNNER_TEMP/hang-ten-package-stage"
          TARGET_BUILD_DIR="$resource_root/build" \
          UNLOCALIZED_RESOURCES_FOLDER_PATH="Resources" \
          DERIVED_FILE_DIR="$resource_root/DerivedFiles" \
          python3 scripts/stage-board-packages.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --destination "$resource_root/build/Resources/Hangboards"
          python3 Tools/HangboardCAD/board_manifest.py --all --output-dir "$resource_root/generated"
          for generated in "$resource_root"/generated/*/board.json; do
            slug=$(basename "$(dirname "$generated")")
            cmp "$generated" "$resource_root/build/Resources/Hangboards/$slug/board.json"
          done
          if find "$resource_root/build" -name '*.FCStd' | grep -q .; then
            echo "error: a CAD authoring source was staged into the app bundle" >&2
            exit 1
          fi

      - name: Stage board packages as the Android build does
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          asset_root="$RUNNER_TEMP/hang-ten-android-stage"
          scripts/run-supported-python.sh scripts/stage-board-packages.py \
            --target android \
            --repository-root "$GITHUB_WORKSPACE" \
            --destination "$asset_root/Hangboards"
          for source in Hangboards/*/*.FCStd; do
            slug=$(basename "$(dirname "$source")")
            test -s "$asset_root/Hangboards/$slug/board.json"
            test -s "$asset_root/Hangboards/$slug/assets/primary.usdz"
          done
          if find "$asset_root" -name '*.FCStd' | grep -q .; then
            echo "error: a CAD authoring source was staged into the Android assets" >&2
            exit 1
          fi

      - name: Run pytest suite
        run: python -m pytest tests -q --junitxml=pytest-results.xml

      - name: Run CAD board-manifest, source-contract, and delivery-lock tests
        if: ${{ !cancelled() }}
        run: >-
          python -m pytest
          ../HangboardCAD/tests/test_board_manifest.py
          ../HangboardCAD/tests/test_contract.py
          ../HangboardModels/tests/test_model_delivery_alignment.py
          -q
          --junitxml=pytest-cad-results.xml

      # actions/upload-artifact v4.6.2
      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-test-results-${{ github.run_id }}
          path: |
            Tools/HangboardPackages/pytest-results.xml
            Tools/HangboardPackages/pytest-cad-results.xml
          if-no-files-found: ignore

  cad-reproducibility:
    name: "CAD (committed assets rebuild byte-identically)"
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.cad == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true

      # actions/setup-python v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install OpenUSD where FreeCAD's interpreter can see it
        run: |
          set -euo pipefail
          python -m pip install --target "$RUNNER_TEMP/cad-extra" "usd-core==26.8"

      - name: Install the pinned FreeCAD
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/FreeCAD_1.1.3-macOS-arm64-py311.dmg"
          curl -fsSL -o "$dmg" \
            "https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-macOS-arm64-py311.dmg"
          echo "f5c0ece7cd7c932466d6effadc0fc6e179b0538a9d9a6a77a6769eae3af2667c  $dmg" \
            | shasum -a 256 -c -
          mount="$RUNNER_TEMP/freecad-dmg"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -quiet
          ditto "$mount/FreeCAD.app" /Applications/FreeCAD.app
          hdiutil detach "$mount" -quiet
          xattr -dr com.apple.quarantine /Applications/FreeCAD.app || true

      - name: Verify each source-backed board rebuilds byte-identically
        run: |
          set -euo pipefail
          python3 Tools/HangboardCAD/verify_reproducible.py \
            --extra-python-path "$RUNNER_TEMP/cad-extra" \
            --keep-rebuild "$RUNNER_TEMP/cad-rebuilt"

      # On a mismatch, publish the pinned-toolchain rebuild (laid out like
      # Hangboards/: <slug>/assets/primary.usdz + primary.model.json) so a
      # contributor without this toolchain can review and commit those bytes.
      # The verify step above still fails the job.
      # actions/upload-artifact v4.6.2
      - name: Upload pinned-toolchain rebuild on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cad-rebuilt-assets
          path: ${{ runner.temp }}/cad-rebuilt
          retention-days: 7
          if-no-files-found: ignore

  workflow-lint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # reviewdog/action-actionlint v1.73.2
      - name: Validate workflow syntax
        uses: reviewdog/action-actionlint@320fcdd9c860767cf17fab3b20e22e739d5d02b8
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: error

  build-required:
    # Keep this stable: branch protection requires this exact check name. A
    # test job skipped by path classification is reported here so this stable
    # check does not leave the pull request waiting forever. Depends on the
    # HangTenUITests aggregator (not shards) so the required check graph is
    # unchanged.
    name: Build (Debug simulator)
    needs:
      - changes
      - test-unit
      - test-ui
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Report required build status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          UNIT_TEST_RESULT: ${{ needs.test-unit.result }}
          UI_TEST_RESULT: ${{ needs.test-ui.result }}
          BUILD_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" == "cancelled" ]]; then
            echo "Change classification was cancelled for this attempt; evaluating only non-cancelled runs."
            exit 0
          fi
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$BUILD_REQUIRED" == "true" ]]; then
            # Prefer failure over cancelled so a failed shard is not masked when
            # a sibling is cancelled mid-run.
            if [[ "$UNIT_TEST_RESULT" == "failure" || "$UI_TEST_RESULT" == "failure" ]]; then
              echo "Required iOS test failed: HangTenTests=$UNIT_TEST_RESULT HangTenUITests=$UI_TEST_RESULT" >&2
              exit 1
            fi
            if [[ "$UNIT_TEST_RESULT" == "cancelled" || "$UI_TEST_RESULT" == "cancelled" ]]; then
              echo "Required iOS test was cancelled for this attempt; evaluating only non-cancelled runs."
              exit 0
            fi
            if [[ "$UNIT_TEST_RESULT" != "success" ]] || [[ "$UI_TEST_RESULT" != "success" ]]; then
              echo "Required iOS test did not succeed: HangTenTests=$UNIT_TEST_RESULT HangTenUITests=$UI_TEST_RESULT" >&2
              exit 1
            fi
            echo "Required iOS tests succeeded."
          else
            # HangTenTests is path-gated and skipped when iOS is not required.
            # The HangTenUITests aggregator always runs (like this job) and
            # reports success only after confirming all five shards were skipped.
            if [[ "$UNIT_TEST_RESULT" != "skipped" ]]; then
              echo "Non-required HangTenTests had unexpected result: $UNIT_TEST_RESULT" >&2
              exit 1
            fi
            if [[ "$UI_TEST_RESULT" == "failure" ]]; then
              echo "Non-required UI test aggregator failed: HangTenUITests=$UI_TEST_RESULT" >&2
              exit 1
            fi
            if [[ "$UI_TEST_RESULT" == "cancelled" ]]; then
              echo "UI test aggregator was cancelled for this attempt; evaluating only non-cancelled runs."
              exit 0
            fi
            if [[ "$UI_TEST_RESULT" != "success" ]]; then
              echo "Non-required UI test aggregator did not succeed: HangTenUITests=$UI_TEST_RESULT" >&2
              exit 1
            fi
            echo "iOS tests are not required for the changed components."
          fi

  build-release-device:
    name: Build (Release device)
    needs:
      - changes
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Release device
        env:
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hang-ten-logs" "$RUNNER_TEMP/hang-ten-derived-data"
          telemetry_xcconfig="$(mktemp "$RUNNER_TEMP/hang-ten-analytics.XXXXXX")"
          trap 'rm -f "$telemetry_xcconfig"' EXIT
          umask 077
          printf 'ANALYTICS_API_KEY = %s\n' "$ANALYTICS_API_KEY" > "$telemetry_xcconfig"
          chmod 600 "$telemetry_xcconfig"
          unset ANALYTICS_API_KEY
          xcodebuild \
            -project HangTen.xcodeproj \
            -scheme HangTen \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/hang-ten-derived-data/Release-iphoneos" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/hang-ten-swiftpm-source-packages" \
            -showBuildTimingSummary \
            -xcconfig "$telemetry_xcconfig" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/hang-ten-logs/Release-iphoneos.log"

      # actions/upload-artifact v4.6.2
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-build-logs-Release-iphoneos-${{ github.run_id }}
          path: ${{ runner.temp }}/hang-ten-logs/
          if-no-files-found: ignore

  test-unit:
    name: "Test (iOS Simulator: HangTenTests)"
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.ios == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: macos-26
    # One soft retry plus result-bundle upload need a little headroom,
    # while each attempt has its own watchdog below.
    timeout-minutes: 70

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Capture Xcode version for DerivedData cache key
        run: |
          set -euo pipefail
          mkdir -p .context
          xcodebuild -version | tee .context/ci-xcode-version.txt

      # actions/cache/restore v4.2.3
      # Suite name comes before Xcode/Package hashes so restore-keys cannot
      # accidentally hydrate unit DerivedData from a UITest cache (or vice versa).
      - name: Restore Xcode DerivedData
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-test-derived-data
          key: deriveddata-${{ runner.os }}-${{ runner.arch }}-HangTenTests-${{ hashFiles('.context/ci-xcode-version.txt') }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ runner.arch }}-HangTenTests-${{ hashFiles('.context/ci-xcode-version.txt') }}-
            deriveddata-${{ runner.os }}-${{ runner.arch }}-HangTenTests-

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate App Store metadata
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.metadata == 'true' ||
          needs.changes.outputs.workflow == 'true' ||
          needs.changes.outputs.shared_board_content == 'true'
        env:
          SWIFT_PACKAGE_CACHE_PATH: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
        run: scripts/validate-app-store-metadata.sh

      - name: Validate App Store release versioning
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.workflow == 'true'
        run: scripts/tests/release-workflow-version-test.zsh

      - name: Run XCTest suite
        id: xctest
        env:
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}
          XCTEST_ATTEMPT_TIMEOUT_SECONDS: "1800"
          XCTEST_LABEL: HangTenTests
          XCTEST_DERIVED_DATA: ${{ runner.temp }}/hang-ten-test-derived-data
          XCTEST_LOG_ROOT: ${{ runner.temp }}/hang-ten-test-logs
          XCTEST_RESULT_ROOT: ${{ runner.temp }}
          XCTEST_ONLY_TESTING: HangTenTests
          XCTEST_PARALLEL_WORKERS: "2"
          SWIFT_PACKAGE_CACHE_PATH: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
        run: |
          set -euo pipefail
          mkdir -p "$XCTEST_DERIVED_DATA" "$XCTEST_LOG_ROOT"
          telemetry_xcconfig="$(mktemp "$RUNNER_TEMP/hang-ten-analytics.XXXXXX")"
          trap 'rm -f "$telemetry_xcconfig"' EXIT
          umask 077
          printf 'ANALYTICS_API_KEY = %s\n' "$ANALYTICS_API_KEY" > "$telemetry_xcconfig"
          chmod 600 "$telemetry_xcconfig"
          unset ANALYTICS_API_KEY
          XCTEST_XCCONFIG="$telemetry_xcconfig" scripts/ci-run-xctest.sh

      # actions/upload-artifact v4.6.2
      - name: Upload test diagnostics on failure
        if: failure() || cancelled() || steps.xctest.outputs.attempt_1_failed == 'true' || steps.xctest.outputs.attempt_2_failed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-test-results-HangTenTests-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/HangTenTests-attempt-*.xcresult
            ${{ runner.temp }}/hang-ten-test-logs/
          if-no-files-found: ignore

      - name: Verify simulator HealthKit entitlement
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d "$RUNNER_TEMP/hang-ten-test-derived-data" ]]; then
            echo "Simulator test derived data was not generated." >&2
            exit 1
          fi
          entitlements_path="$(
            find "$RUNNER_TEMP/hang-ten-test-derived-data" \
              -type f \
              -name 'HangTen.app-Simulated.xcent' \
              -print \
              -quit
          )"
          if [[ -z "$entitlements_path" ]]; then
            echo "Simulator HealthKit entitlements were not generated." >&2
            exit 1
          fi
          healthkit_enabled="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :com.apple.developer.healthkit' \
              "$entitlements_path"
          )"
          if [[ "$healthkit_enabled" != "true" ]]; then
            echo "Simulator HealthKit entitlement must be true; found: $healthkit_enabled" >&2
            exit 1
          fi

      # actions/cache/save v4.2.3
      # Save only on success so failed builds cannot poison DerivedData.
      - name: Save Xcode DerivedData
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-test-derived-data
          key: deriveddata-${{ runner.os }}-${{ runner.arch }}-HangTenTests-${{ hashFiles('.context/ci-xcode-version.txt') }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}

  test-ui-paywall:
    name: "Test (iOS Simulator: HangTenUITests / paywall)"
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.ios == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: macos-26
    timeout-minutes: 70

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Capture Xcode version for DerivedData cache key
        run: |
          set -euo pipefail
          mkdir -p .context
          xcodebuild -version | tee .context/ci-xcode-version.txt

      # actions/cache/restore v4.2.3
      - name: Restore Xcode DerivedData
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-ui-test-derived-data
          key: deriveddata-${{ runner.os }}-${{ runner.arch }}-HangTenUITests-paywall-${{ hashFiles('.context/ci-xcode-version.txt') }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ runner.arch }}-HangTenUITests-paywall-${{ hashFiles('.context/ci-xcode-version.txt') }}-
            deriveddata-${{ runner.os }}-${{ runner.arch }}-HangTenUITests-paywall-

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Run XCTest suite
        id: xctest
        env:
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}
