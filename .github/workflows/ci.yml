name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed components
    # Closing (or merging) a pull request only needs to enter its distinct,
    # event-specific concurrency group, so a merged PR's pull_request.closed
    # event cannot cancel the merge push CI; it does no other work.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      python: ${{ steps.filter.outputs.python }}
      workbench_web: ${{ steps.filter.outputs.workbench_web }}
      workbench_native: ${{ steps.filter.outputs.workbench_native }}
      shared_board_content: ${{ steps.filter.outputs.shared_board_content }}
      metadata: ${{ steps.filter.outputs.metadata }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: .github/ci-paths.yml

  metadata:
    name: Validate App Store metadata
    needs:
      - changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.metadata == 'true' &&
      needs.changes.outputs.ios != 'true' &&
      needs.changes.outputs.workflow != 'true' &&
      needs.changes.outputs.shared_board_content != 'true'
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Validate App Store metadata
        env:
          SWIFT_PACKAGE_CACHE_PATH: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
        run: scripts/validate-app-store-metadata.sh

  python:
    name: Test (Python)
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.shared_board_content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Tools/HangboardPackages

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Tools/HangboardPackages/pyproject.toml

      - name: Validate canonical board packages
        working-directory: ${{ github.workspace }}
        run: scripts/hangboard-packages.sh validate --root Hangboards --final-inventory

      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Stage board packages into a temporary app resource root
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          resource_root="$RUNNER_TEMP/hang-ten-package-stage"
          TARGET_BUILD_DIR="$resource_root/build" \
          UNLOCALIZED_RESOURCES_FOLDER_PATH="Resources" \
          python3 scripts/stage-board-packages.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --destination "$resource_root/build/Resources/Hangboards"

      - name: Run pytest suite
        run: python -m pytest tests -q --junitxml=pytest-results.xml

      # actions/upload-artifact v4.6.2
      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-test-results-${{ github.run_id }}
          path: Tools/HangboardPackages/pytest-results.xml
          if-no-files-found: ignore

  android:
    name: Android validation
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.android == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.shared_board_content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-java v4.7.1
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'

      # actions/cache v4.2.3
      - name: Restore Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/gradle/wrapper/gradle-wrapper.properties', 'Android/**/*.gradle.kts', 'Android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Stage canonical content, test, lint, and assemble Debug APK
        run: >-
          ./Android/gradlew -p Android
          -PGITHUB_OAUTH_CLIENT_ID=hangten_ci_public_device_flow_client
          :app:stageCanonicalAssets :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # reactivecircus/android-emulator-runner v2.37.0
      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          # API 36 publishes the compatible system image for x86_64, not x86.
          arch: x86_64
          script: ./Android/gradlew -p Android :app:connectedDebugAndroidTest

      # actions/upload-artifact v4.6.2
      - name: Upload Android APK and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-verification-${{ github.run_id }}
          path: |
            Android/app/build/outputs/apk/debug/*.apk
            Android/app/build/outputs/bundle/release/*.aab
            Android/app/build/reports/**
            Android/app/build/test-results/**
            Android/app/build/outputs/androidTest-results/**
          if-no-files-found: warn

  workflow-lint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # reviewdog/action-actionlint v1.73.2
      - name: Validate workflow syntax
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: error

  android-required:
    # Keep this stable: branch protection requires this exact check name. An
    # Android job skipped by path classification is reported here so this
    # stable check does not leave the pull request waiting forever.
    name: Android verification
    needs:
      - changes
      - android
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Report required Android status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.android == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.shared_board_content == 'true' }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" == "cancelled" ]]; then
            echo "Change classification was cancelled for this attempt; evaluating only non-cancelled runs."
            exit 0
          fi
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$ANDROID_REQUIRED" == "true" ]]; then
            if [[ "$ANDROID_RESULT" == "cancelled" ]]; then
              echo "Required Android validation was cancelled for this attempt; evaluating only non-cancelled runs."
              exit 0
            fi
            if [[ "$ANDROID_RESULT" != "success" ]]; then
              echo "Required Android validation did not succeed: $ANDROID_RESULT" >&2
              exit 1
            fi
            echo "Required Android validation succeeded."
          else
            if [[ "$ANDROID_RESULT" != "skipped" ]]; then
              echo "Non-required Android validation had unexpected result: $ANDROID_RESULT" >&2
              exit 1
            fi
            echo "Android validation is not required for the changed components."
          fi

  build-required:
    # Keep this stable: branch protection requires this exact check name. A
    # test job skipped by path classification is reported here so this stable
    # check does not leave the pull request waiting forever.
    name: Build (Debug simulator)
    needs:
      - changes
      - test
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Report required build status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.test.result }}
          BUILD_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.shared_board_content == 'true' }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" == "cancelled" ]]; then
            echo "Change classification was cancelled for this attempt; evaluating only non-cancelled runs."
            exit 0
          fi
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$BUILD_REQUIRED" == "true" ]]; then
            if [[ "$BUILD_RESULT" == "cancelled" ]]; then
              echo "Required iOS test was cancelled for this attempt; evaluating only non-cancelled runs."
              exit 0
            fi
            if [[ "$BUILD_RESULT" != "success" ]]; then
              echo "Required iOS test did not succeed: $BUILD_RESULT" >&2
              exit 1
            fi
            echo "Required iOS test succeeded."
          else
            if [[ "$BUILD_RESULT" != "skipped" ]]; then
              echo "Non-required iOS test had unexpected result: $BUILD_RESULT" >&2
              exit 1
            fi
            echo "iOS test is not required for the changed components."
          fi

  build-release-device:
    name: Build (Release device)
    needs:
      - changes
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Release device
        env:
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hang-ten-logs" "$RUNNER_TEMP/hang-ten-derived-data"
          telemetry_xcconfig="$(mktemp "$RUNNER_TEMP/hang-ten-analytics.XXXXXX")"
          trap 'rm -f "$telemetry_xcconfig"' EXIT
          umask 077
          printf 'ANALYTICS_API_KEY = %s\n' "$ANALYTICS_API_KEY" > "$telemetry_xcconfig"
          chmod 600 "$telemetry_xcconfig"
          unset ANALYTICS_API_KEY
          xcodebuild \
            -project HangTen.xcodeproj \
            -scheme HangTen \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/hang-ten-derived-data/Release-iphoneos" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/hang-ten-swiftpm-source-packages" \
            -showBuildTimingSummary \
            -xcconfig "$telemetry_xcconfig" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/hang-ten-logs/Release-iphoneos.log"

      # actions/upload-artifact v4.6.2
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-build-logs-Release-iphoneos-${{ github.run_id }}
          path: ${{ runner.temp }}/hang-ten-logs/
          if-no-files-found: ignore

  test:
    name: Test (iOS Simulator)
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.ios == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.shared_board_content == 'true'
    runs-on: macos-26
    # Two bounded attempts plus result-bundle upload need a little headroom,
    # while each attempt has its own watchdog below.
    timeout-minutes: 50

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/cache v4.2.3
      - name: Restore Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
          key: swiftpm-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate App Store metadata
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.metadata == 'true' ||
          needs.changes.outputs.workflow == 'true' ||
          needs.changes.outputs.shared_board_content == 'true'
        env:
          SWIFT_PACKAGE_CACHE_PATH: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
        run: scripts/validate-app-store-metadata.sh

      - name: Validate App Store release versioning
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.workflow == 'true'
        run: scripts/tests/release-workflow-version-test.zsh

      - name: Run XCTest suite
        id: xctest
        env:
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}
          XCTEST_ATTEMPT_TIMEOUT_SECONDS: "1200"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hang-ten-test-logs" "$RUNNER_TEMP/hang-ten-test-derived-data"
          telemetry_xcconfig="$(mktemp "$RUNNER_TEMP/hang-ten-analytics.XXXXXX")"
          trap 'rm -f "$telemetry_xcconfig"' EXIT
          umask 077
          printf 'ANALYTICS_API_KEY = %s\n' "$ANALYTICS_API_KEY" > "$telemetry_xcconfig"
          chmod 600 "$telemetry_xcconfig"
          unset ANALYTICS_API_KEY

          run_xctest_attempt() {
            local attempt="$1"
            local attempt_derived_data="$RUNNER_TEMP/hang-ten-test-derived-data/attempt-$attempt"
            local attempt_result_bundle="$RUNNER_TEMP/HangTenTests-attempt-$attempt.xcresult"
            local attempt_log_dir="$RUNNER_TEMP/hang-ten-test-logs/attempt-$attempt"
            local attempt_log="$attempt_log_dir/test.log"
            local timeout_seconds="$XCTEST_ATTEMPT_TIMEOUT_SECONDS"
            local attempt_started
            local xcodebuild_pid
            local xcodebuild_status=0

            mkdir -p "$attempt_derived_data" "$attempt_log_dir"
            : > "$attempt_log"

            # Do not let a simulator/XCTest deadlock consume the whole job.
            # Writing xcodebuild output to a file lets the watchdog sample the
            # still-running process before it is terminated; the complete log
            # is printed and uploaded after either outcome.
            attempt_started=$SECONDS
            # Give xcodebuild and its XCTest/simulator descendants their own
            # process group. A background command normally inherits this
            # script's group, so signalling that inherited group could kill
            # the Actions shell itself. Python is present on hosted macOS
            # runners and setsid() makes the exec'd xcodebuild PID its group
            # leader, which lets the timeout clean up the whole attempt.
            python3 -c 'import os, sys; os.setsid(); os.execvp(sys.argv[1], sys.argv[1:])' \
              xcodebuild \
              -project HangTen.xcodeproj \
              -scheme HangTen \
              -configuration Debug \
              -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=latest" \
              -parallel-testing-enabled YES \
              -maximum-parallel-testing-workers 1 \
              -derivedDataPath "$attempt_derived_data" \
              -resultBundlePath "$attempt_result_bundle" \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/hang-ten-swiftpm-source-packages" \
              -showBuildTimingSummary \
              -xcconfig "$telemetry_xcconfig" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGN_IDENTITY="-" \
              test > "$attempt_log" 2>&1 &
            xcodebuild_pid=$!

            while kill -0 "$xcodebuild_pid" 2>/dev/null; do
              if (( SECONDS - attempt_started >= timeout_seconds )); then
                echo "XCTest attempt $attempt exceeded ${timeout_seconds}s; collecting diagnostics before retrying." | tee -a "$attempt_log"
                sample "$xcodebuild_pid" 10 -file "$attempt_log_dir/xcodebuild.sample.txt" || true
                xcrun simctl list devices >> "$attempt_log_dir/simctl-devices.txt" 2>&1 || true
                # Signal the isolated process group, not merely xcodebuild:
                # XCTest and Simulator children can otherwise outlive a timed
                # out attempt and interfere with the clean retry below.
                kill -TERM -- "-$xcodebuild_pid" 2>/dev/null || true
                for _ in $(seq 1 30); do
                  # Keep waiting for the group even if xcodebuild itself has
                  # already exited: its children may still be shutting down.
                  kill -0 -- "-$xcodebuild_pid" 2>/dev/null || break
                  sleep 1
                done
                if kill -0 -- "-$xcodebuild_pid" 2>/dev/null; then
                  echo "XCTest attempt $attempt ignored SIGTERM; sending SIGKILL." | tee -a "$attempt_log"
                  kill -KILL -- "-$xcodebuild_pid" 2>/dev/null || true
                fi
                wait "$xcodebuild_pid" || true
                cat "$attempt_log"
                return 124
              fi
              sleep 5
            done

            wait "$xcodebuild_pid" || xcodebuild_status=$?
            cat "$attempt_log"
            return "$xcodebuild_status"
          }

          if ! run_xctest_attempt 1; then
            echo "attempt_1_failed=true" >> "$GITHUB_OUTPUT"
            echo "XCTest attempt 1 failed; retrying once with clean paths."
            run_xctest_attempt 2
          fi

      # actions/upload-artifact v4.6.2
      - name: Upload test diagnostics on failure
        if: failure() || cancelled() || steps.xctest.outputs.attempt_1_failed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-test-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/HangTenTests-attempt-*.xcresult
            ${{ runner.temp }}/hang-ten-test-logs/
          if-no-files-found: ignore

      - name: Verify simulator HealthKit entitlement
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d "$RUNNER_TEMP/hang-ten-test-derived-data" ]]; then
            echo "Simulator test derived data was not generated." >&2
            exit 1
          fi
          entitlements_path="$(
            find "$RUNNER_TEMP/hang-ten-test-derived-data" \
              -type f \
              -name 'HangTen.app-Simulated.xcent' \
              -print \
              -quit
          )"
          if [[ -z "$entitlements_path" ]]; then
            echo "Simulator HealthKit entitlements were not generated." >&2
            exit 1
          fi
          healthkit_enabled="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :com.apple.developer.healthkit' \
              "$entitlements_path"
          )"
          if [[ "$healthkit_enabled" != "true" ]]; then
            echo "Simulator HealthKit entitlement must be true; found: $healthkit_enabled" >&2
            exit 1
          fi
