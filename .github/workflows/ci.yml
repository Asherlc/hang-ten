          XCTEST_LOG_ROOT: ${{ runner.temp }}/hang-ten-ui-test-logs
          XCTEST_RESULT_ROOT: ${{ runner.temp }}
          XCTEST_ONLY_TESTING: ${{ matrix.only_testing }}
          XCTEST_PARALLEL_WORKERS: "1"
          SWIFT_PACKAGE_CACHE_PATH: ${{ runner.temp }}/hang-ten-swiftpm-source-packages
        run: |
          set -euo pipefail
          mkdir -p "$XCTEST_DERIVED_DATA" "$XCTEST_LOG_ROOT"
          telemetry_xcconfig="$(mktemp "$RUNNER_TEMP/hang-ten-analytics.XXXXXX")"
          trap 'rm -f "$telemetry_xcconfig"' EXIT
          umask 077
          printf 'ANALYTICS_API_KEY = %s\n' "$ANALYTICS_API_KEY" > "$telemetry_xcconfig"
          chmod 600 "$telemetry_xcconfig"
          unset ANALYTICS_API_KEY
          XCTEST_XCCONFIG="$telemetry_xcconfig" scripts/ci-run-xctest.sh

      # Retain passing and failing evidence for the runtime comparison.
      # actions/upload-artifact v4.6.2
      - name: Upload board runtime comparison diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-test-results-HangTenUITests-map-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/HangTenUITests-map-${{ matrix.shard }}-run.xcresult
            ${{ runner.temp }}/hang-ten-ui-test-logs/
          if-no-files-found: ignore

      # actions/cache/save v4.2.3
      - name: Save Xcode DerivedData
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hang-ten-ui-test-derived-data
          key: deriveddata-${{ runner.os }}-${{ runner.arch }}-HangTenUITests-map-${{ matrix.shard }}-${{ hashFiles('.context/ci-xcode-version.txt') }}-${{ hashFiles('HangTen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}

  test-ui:
    # Keep this stable: branch ruleset "Main" requires this exact check name.
    # Shard display names can differ; this aggregator is the required context.
    name: "Test (iOS Simulator: HangTenUITests)"
    needs:
      - changes
      - test-ui-paywall
      - test-ui-map
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
