name: Publish reviewed mounting-bore repairs

on:
  push:
    branches:
      - fix/remove-model-screw-holes-20260921
    paths:
      - .github/workflows/model-screw-hole-publish.yml

permissions:
  contents: write

concurrency:
  group: remove-model-screw-holes-20260921-publish
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      REPAIR_BRANCH: fix/remove-model-screw-holes-20260921
      SCRATCH: .context/remove-model-screw-holes-20260921
    steps:
      - name: Check out the isolated repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          persist-credentials: true
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify and unpack reviewed source transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, zlib
          root = pathlib.Path.cwd()
          scratch = root / os.environ['SCRATCH']
          expected = [
              '68069c6da7ebcc7f382213768b48047601c0139abf691271b77f4f6c5538087f',
              'f258cf3d4a5615b5f14d99b3d56c1cc3c6959fed85f33a64743c7cb36115cf65',
              '7e9fc567f8839cf706e00958f8f15cb07e282861bee215818df09286639bebe9',
              '40023b23066cab78df76b9b3071b56659299f725a5239783a47336a247e718f8',
          ]
          chunks = []
          for i, digest in enumerate(expected):
              chunk = (scratch / f'payload-{i}.txt').read_text().strip()
              if i == 2:
                  chunk = chunk.replace('Jw+Lwh9+ePDZU', 'Jw+Lwh9+PDZU')
              actual = hashlib.sha256(chunk.encode()).hexdigest()
              print(f'payload-{i}: {len(chunk)} bytes, SHA256 {actual}')
              if actual != digest:
                  raise SystemExit(f'Payload {i} transport hash mismatch')
              chunks.append(chunk)
          compressed = base64.b64decode(''.join(chunks), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'e170181c3f1d53a9b0aa0dfc5575504a6a09a20e27957ab635ea0083ce942c2c'
          files = json.loads(zlib.decompress(compressed))
          assert len(files) == 6
          for name, content in files.items():
              path = pathlib.PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts or not name.startswith(('Tools/HangboardModels/', 'docs/source-audits/')):
                  raise SystemExit(f'Unexpected transport path: {name}')
              destination = root / path
              if destination.exists():
                  raise SystemExit(f'Refusing to replace existing source: {name}')
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(content, encoding='utf-8')
          changed = list(files)
          for filename, old_node in [
              ('verify_metolius_climbers_edge.py', 'bore_free_body_caps_001'),
              ('verify_the_hangboard.py', 'mounting_hardware_omission_caps_001'),
          ]:
              path = root / 'Tools/HangboardModels' / filename
              text = path.read_text()
              assert 'EXPECTED_CAP_NODE_ID' in text
              text = text.replace('EXPECTED_CAP_NODE_ID', 'EXPECTED_BODY_NODE_ID')
              old = f'EXPECTED_BODY_NODE_ID = "{old_node}"'
              assert old in text
              text = text.replace(old, 'EXPECTED_BODY_NODE_ID = "body_001"')
              text = text.replace('cap node', 'body surface').replace('body cap', 'repaired body surface').replace('hardware cover', 'repaired body surface').replace('mounting-hardware cover is missing', 'mounting-bore surface is missing')
              path.write_text(text)
              changed.append(path.relative_to(root).as_posix())
          path = root / 'Tools/HangboardModels/test_verify_metolius_climbers_edge.py'
          text = path.read_text().replace('hit_the_nonselectable_cap_node', 'hit_the_repaired_body_not_a_floating_cap')
          text = text.replace('"bore_free_body_caps_001"', '"body_001"')
          text = text.replace('results[-1]["nodeID"] = "body_001"', 'results[-1]["nodeID"] = "bore_free_body_caps_001"')
          path.write_text(text.replace('cap node', 'body surface'))
          changed.append(path.relative_to(root).as_posix())
          path = root / 'Tools/HangboardModels/test_verify_the_hangboard.py'
          text = path.read_text().replace('test_hardware_cover_contract_rejects_body_or_missing_results', 'test_repaired_surface_contract_rejects_floating_caps')
          text = text.replace('verifier.EXPECTED_CAP_NODE_ID', '"body_001"')
          text = text.replace('results[-1]["nodeID"] = "body_001"', 'results[-1]["nodeID"] = "mounting_hardware_omission_caps_001"')
          path.write_text(text.replace('cap node', 'body surface'))
          changed.append(path.relative_to(root).as_posix())
          path = root / 'Tools/HangboardPackages/tests/test_approved_board_packages.py'
          text = path.read_text().replace('{"body_001", "bore_free_body_caps_001"}', '{"body_001"}')
          text = text.replace('{"board_body_001", "mounting_hardware_omission_caps_001"}', '{"board_body_001"}')
          text = text.replace('        "bore_free_body_caps_001",\n', '')
          path.write_text(text)
          changed.append(path.relative_to(root).as_posix())
          (scratch / 'changed-sources.json').write_text(json.dumps(changed))
          PY
      - name: Install pinned non-Blender dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r Tools/HangboardModels/mounting_bore_requirements.txt pytest Pillow PyYAML black==24.10.0
          python -m black Tools/HangboardModels/remove_mounting_bores.py Tools/HangboardModels/verify_mounting_bores.py Tools/HangboardModels/tests/test_remove_mounting_bores.py
      - name: Preserve the exact unmodified catalogue
        run: |
          mkdir -p "$SCRATCH/before"
          cp -a Hangboards "$SCRATCH/before/"
      - name: Generate the reviewed repairs
        shell: bash
        run: |
          set -euo pipefail
          python Tools/HangboardModels/remove_mounting_bores.py --root "$GITHUB_WORKSPACE" --manifest Tools/HangboardModels/mounting_bore_repairs.json --output "$SCRATCH/repaired" 2>&1 | tee "$SCRATCH/generation.log"
          python - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path.cwd()
          scratch = root / os.environ['SCRATCH']
          manifest = json.loads((root / 'Tools/HangboardModels/mounting_bore_repairs.json').read_text())
          for slug in manifest['models']:
              for name in ('primary.usdz', 'primary.model.json'):
                  relative = pathlib.Path('Hangboards') / slug / 'assets' / name
                  shutil.copyfile(scratch / 'repaired' / relative, root / relative)
          PY
      - name: Verify actual exports and preserved source boundaries
        shell: bash
        run: |
          set -euo pipefail
          python Tools/HangboardModels/verify_mounting_bores.py --root "$GITHUB_WORKSPACE" --source-root "$SCRATCH/before" --manifest Tools/HangboardModels/mounting_bore_repairs.json --report docs/source-audits/2026-09-22-mounting-bore-verification.json 2>&1 | tee "$SCRATCH/verification.log"
      - name: Run model and package test suites
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest Tools/HangboardModels Tools/HangboardPackages/tests -q 2>&1 | tee "$SCRATCH/tests.log"
          PYTHONPATH=Tools/HangboardPackages/src python -m hangboard_packages.cli validate --root Hangboards --final-inventory 2>&1 | tee "$SCRATCH/packages.log"
      - name: Commit verified changes to the repair branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$REPAIR_BRANCH"
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          scratch = root / os.environ['SCRATCH']
          paths = json.loads((scratch / 'changed-sources.json').read_text())
          manifest = json.loads((root / 'Tools/HangboardModels/mounting_bore_repairs.json').read_text())
          for slug in manifest['models']:
              paths.extend(f'Hangboards/{slug}/assets/{name}' for name in ('primary.usdz', 'primary.model.json'))
          paths.append('docs/source-audits/2026-09-22-mounting-bore-verification.json')
          subprocess.run(['git', 'add', '--', *paths], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(staged) == set(paths), (set(paths) - set(staged), set(staged) - set(paths))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(models): remove 106 mounting bores from 13 shipped models'
          git lfs push origin HEAD
          git push origin "HEAD:refs/heads/$REPAIR_BRANCH"
          git rev-parse HEAD | tee "$SCRATCH/published-commit.txt"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remove-model-screw-holes-20260921-verification
          path: |
            .context/remove-model-screw-holes-20260921/*.log
            .context/remove-model-screw-holes-20260921/published-commit.txt
            .context/remove-model-screw-holes-20260921/repaired/repair-report.json
            docs/source-audits/2026-09-22-mounting-bore-verification.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
