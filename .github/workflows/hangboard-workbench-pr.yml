name: Build Hangboard Workbench for pull requests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
  merge_group:

permissions:
  contents: read

concurrency:
  group: hangboard-workbench-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed components
    # Closing (or merging) a pull request only needs to enter the
    # concurrency group above so it cancels any stale runs still queued or
    # in progress for this ref; it does no other work.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workbench: ${{ steps.filter.outputs.workbench }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: .github/ci-paths.yml

  test-js:
    name: Test Workbench JavaScript
    needs: changes
    if: needs.changes.outputs.workbench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: Tools/HangboardWorkbench/package-lock.json

      - name: Install and verify React TypeScript workbench
        working-directory: Tools/HangboardWorkbench
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run check:bundle

  test-python:
    name: Test Workbench Python
    needs: changes
    if: needs.changes.outputs.workbench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v6.3.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Tools/HangboardWorkbench/pyproject.toml

      - name: Run Python suite
        run: |
          set -euo pipefail
          python_bin="$GITHUB_WORKSPACE/.context/hangboard-workbench-test-venv/bin/python"
          python -m venv "${python_bin%/bin/python}"
          "$python_bin" -m pip install --upgrade pip
          "$python_bin" -m pip install -e 'Tools/HangboardWorkbench[dev]'
          "$python_bin" -m pytest Tools/HangboardWorkbench/tests -q

  native-build:
    name: Build arm64 workbench artifact
    needs:
      - changes
      - test-js
      - test-python
    if: needs.changes.outputs.workbench == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/cache v4.2.3
      - name: Restore native Swift build products
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: Tools/HangboardWorkbench/macos/.build
          key: hangboard-workbench-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/HangboardWorkbench/macos/Package.resolved') }}

      - name: Build and upload verified unsigned app
        uses: ./.github/actions/build-hangboard-workbench

  build:
    # This stable required check reports every prerequisite, rather than being
    # skipped when a failed prerequisite prevents the costly native build.
    name: Build verified arm64 workbench
    needs:
      - changes
      - test-js
      - test-python
      - native-build
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report Workbench validation result
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Workbench change classification did not succeed." >&2
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.workbench }}" != "true" ]]; then
            echo "No Workbench-relevant paths changed."
            exit 0
          fi
          for result in \
            "${{ needs.test-js.result }}" \
            "${{ needs.test-python.result }}" \
            "${{ needs['native-build'].result }}"; do
            if [[ "$result" != "success" ]]; then
              echo "A required Workbench validation did not succeed (result=$result)." >&2
              exit 1
            fi
          done
