name: freecad-authoring-session
on:
  push:
    branches: [feat/freecad-authoring-20260922]
    paths: [.github/workflows/freecad-authoring-session.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare isolated native dependencies
        run: |
          mkdir -p "$PWD/cad-session/debs" "$PWD/cad-session/wheels"
          docker run --rm -v "$PWD/cad-session:/out" debian:trixie-slim sh -euxc '
            apt-get update -qq
            apt-get -y --download-only --no-install-recommends install freecad-python3 python3-pip python3-venv
            cp /var/cache/apt/archives/*.deb /out/debs/
            apt-get -y --no-install-recommends install freecad-python3 python3-pip python3-venv
            python3 -m pip download --only-binary=:all: --no-deps -d /out/wheels usd-core==25.11
            dpkg-query -W > /out/packages.txt
            PYTHONPATH=/usr/lib/freecad-python3/lib:/usr/lib/freecad/lib python3 -c "import FreeCAD as A, Part; d=A.newDocument(\"Example\"); b=d.addObject(\"Part::Box\",\"Body\"); b.Length=100; b.Width=30; b.Height=50; b.addProperty(\"App::PropertyString\",\"HangTenRole\"); b.HangTenRole=\"body\"; d.recompute(); d.saveAs(\"/out/example.FCStd\"); print(A.Version())" > /out/native-smoke.txt
          '
          tar czf cad-session/native-deps.tar.gz -C cad-session debs
          rm -r cad-session/debs
      - uses: actions/upload-artifact@v4
        with:
          name: freecad-authoring-session-native
          path: cad-session/
          retention-days: 7
          if-no-files-found: error
