name: freecad-authoring-session
on:
  push:
    branches: [feat/freecad-authoring-20260922]
    paths: [.github/workflows/freecad-authoring-session.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Fetch runtime models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" lfs pull --include='Hangboards/*/assets/*.usdz'
      - name: Prepare read-only source snapshot
        run: |
          mkdir -p .context/freecad-authoring-session
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          root = pathlib.Path('.')
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with tarfile.open('.context/freecad-authoring-session/workspace.tar.gz', 'w:gz') as out:
              for name in paths:
                  p = root / name
                  if not name or not p.is_file():
                      continue
                  text = p.suffix in {'.py','.sh','.toml','.json','.md','.yml','.yaml','.swift','.rb'} or name in {'.gitattributes','.gitignore'}
                  if text or name.startswith('Hangboards/'):
                      out.add(p, arcname=name, recursive=False)
          PY
          git rev-parse HEAD > .context/freecad-authoring-session/source-commit.txt
      - name: Check native FreeCAD availability
        run: |
          sudo apt-get update -qq
          apt-cache policy freecad-python3 | tee .context/freecad-authoring-session/freecad-available.txt
      - uses: actions/upload-artifact@v4
        with:
          name: freecad-authoring-session-inputs
          path: .context/freecad-authoring-session/
          retention-days: 7
          if-no-files-found: error
