name: Build Hangboard Workbench
description: Build, verify, archive, and upload the unsigned Apple Silicon editor.

outputs:
  artifact-url:
    description: URL for downloading the uploaded workbench artifact.
    value: ${{ steps.upload.outputs.artifact-url }}
  artifact-name:
    description: Name of the uploaded workbench artifact.
    value: hangboard-workbench-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
  artifact-id:
    description: GitHub ID of the uploaded workbench artifact.
    value: ${{ steps.upload.outputs.artifact-id }}

runs:
  using: composite
  steps:
    # actions/setup-python v6.3.0
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: Tools/HangboardWorkbench/pyproject.toml

    - name: Install workbench build dependencies
      shell: bash
      run: |
        set -euo pipefail
        python_bin="$GITHUB_WORKSPACE/.context/hangboard-workbench-venv/bin/python"
        python -m venv "${python_bin%/bin/python}"
        "$python_bin" -m pip install --upgrade pip
        "$python_bin" -m pip install -e 'Tools/HangboardWorkbench[dev]'

    # actions/setup-node v4.4.0
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22.14.0'
        cache: npm
        cache-dependency-path: Tools/HangboardWorkbench/package-lock.json

    - name: Build generated Workbench bundle
      shell: bash
      working-directory: Tools/HangboardWorkbench
      run: |
        set -euo pipefail
        npm ci
        npm run check:bundle

    - name: Run native shell tests
      shell: bash
      run: swift test --package-path Tools/HangboardWorkbench/macos

    - name: Build unsigned native app
      shell: bash
      run: |
        set -euo pipefail
        release_dir="$GITHUB_WORKSPACE/.hangboard-workbench-release"
        runtime_dist_dir="$release_dir/runtime-dist"
        work_dir="$RUNNER_TEMP/hangboard-workbench-build"
        rm -rf "$release_dir" "$work_dir"
        mkdir -p "$release_dir" "$work_dir"
        "$GITHUB_WORKSPACE/.context/hangboard-workbench-venv/bin/python" \
          Tools/HangboardWorkbench/packaging/build.py \
          --commit "$GITHUB_SHA" \
          --dist-dir "$runtime_dist_dir" \
          --work-dir "$work_dir"
        runtime_dir="$runtime_dist_dir/hangboard-workbench"

        swift build -c release --arch arm64 \
          -Xswiftc -g \
          --package-path Tools/HangboardWorkbench/macos
        shell_bin_dir="$(swift build -c release --arch arm64 \
          --package-path Tools/HangboardWorkbench/macos --show-bin-path)"
        shell_executable="$shell_bin_dir/HangboardWorkbench"
        app_bundle="$release_dir/Hangboard Workbench.app"
          "$GITHUB_WORKSPACE/.context/hangboard-workbench-venv/bin/python" \
          Tools/HangboardWorkbench/packaging/macos_app.py \
          --shell "$shell_executable" \
          --runtime-dir "$runtime_dir" \
          --output "$app_bundle" \
          --version "$GITHUB_RUN_NUMBER"

    - name: Verify executable identity
      shell: bash
      run: |
        set -euo pipefail
        app_bundle="$GITHUB_WORKSPACE/.hangboard-workbench-release/Hangboard Workbench.app"
        shell_executable="$app_bundle/Contents/MacOS/HangboardWorkbench"
        runtime_executable="$app_bundle/Contents/Resources/workbench-runtime/hangboard-workbench"
        architecture="$(uname -m)"
        echo "Runner architecture: $architecture"
        test "$architecture" = "arm64"
        file "$shell_executable" "$runtime_executable" \
          | tee "$RUNNER_TEMP/hangboard-workbench-file.txt"
        test "$(grep -c 'arm64' "$RUNNER_TEMP/hangboard-workbench-file.txt")" -eq 2
        "$runtime_executable" --version | tee "$RUNNER_TEMP/hangboard-workbench-version.txt"
        grep -Fqx "$GITHUB_SHA" "$RUNNER_TEMP/hangboard-workbench-version.txt"

    - name: Smoke test unsigned app and clean up
      shell: bash
      run: |
        set -euo pipefail
        app_bundle="$GITHUB_WORKSPACE/.hangboard-workbench-release/Hangboard Workbench.app"
        app_executable="$app_bundle/Contents/MacOS/HangboardWorkbench"
        smoke_log="$RUNNER_TEMP/hangboard-workbench-unsigned-app-smoke.log"
        app_pid=""
        app_child_pid=""
        port=""
        curl_timeout_args=(--connect-timeout 5 --max-time 15)
        readiness_curl_timeout_args=(--connect-timeout 1 --max-time 2)
        process_is_active() {
          local pid="$1"
          local state
          state="$(ps -o stat= -p "$pid" 2>/dev/null || true)"
          [[ -n "$state" && "$state" != *Z* ]]
        }
        select_free_loopback_port() {
          python - <<'PY'
        import socket

        with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as socket_:
            socket_.bind(("127.0.0.1", 0))
            port = socket_.getsockname()[1]
        if not 1024 <= port <= 65535:
            raise SystemExit(f"OS selected invalid loopback port: {port}")
        print(port)
        PY
        }
        listener_belongs_to_app_tree() {
          local listener_pids
          local listener_pid
          local parent_pid
          listener_pids="$(lsof -nP -t -iTCP@127.0.0.1:"$port" -sTCP:LISTEN 2>/dev/null | sort -u || true)"
          if [[ -z "$listener_pids" || "$listener_pids" == *$'\n'* || ! "$listener_pids" =~ ^[0-9]+$ ]]; then
            return 1
          fi
          listener_pid="$listener_pids"
          while [[ -n "$listener_pid" && "$listener_pid" != "1" ]]; do
            if [[ "$listener_pid" == "$app_pid" ]]; then
              return 0
            fi
            parent_pid="$(ps -o ppid= -p "$listener_pid" 2>/dev/null | tr -d ' ' || true)"
            if [[ -z "$parent_pid" || "$parent_pid" == "$listener_pid" ]]; then
              return 1
            fi
            listener_pid="$parent_pid"
          done
          return 1
        }
        print_readiness_diagnostics() {
          local child_pid
          echo "Unsigned app readiness diagnostics:" >&2
          if [[ -n "$port" ]]; then
            echo "--- listeners on smoke port $port ---" >&2
            lsof -nP -iTCP:"$port" -sTCP:LISTEN >&2 || true
            netstat -anv -p tcp 2>/dev/null \
              | awk -v endpoint "127.0.0.1.${port}" '$4 == endpoint && $6 == "LISTEN" { print }' >&2 || true
            echo "--- end listeners on smoke port $port ---" >&2
          fi
          if [[ -n "$app_pid" ]]; then
            ps -o pid=,ppid=,stat=,command= -p "$app_pid" >&2 || true
            while IFS= read -r child_pid; do
              ps -o pid=,ppid=,stat=,command= -p "$child_pid" >&2 || true
            done < <(pgrep -P "$app_pid" || true)
          fi
          if [[ -f "$smoke_log" ]]; then
            echo "--- unsigned app smoke log ---" >&2
            cat "$smoke_log" >&2
            echo "--- end unsigned app smoke log ---" >&2
          fi
        }
        stop_owned_process() {
          local pid="$1"
          local name="$2"
          local deadline
          if ! process_is_active "$pid"; then
            return 0
          fi
          kill -TERM "$pid" || true
          deadline=$((SECONDS + 10))
          while process_is_active "$pid"; do
            if (( SECONDS >= deadline )); then
              echo "$name did not exit after SIGTERM; sending SIGKILL." >&2
              kill -KILL "$pid" || true
              deadline=$((SECONDS + 5))
              while process_is_active "$pid"; do
                if (( SECONDS >= deadline )); then
                  echo "$name did not exit after SIGKILL." >&2
                  return 1
                fi
                sleep 1
              done
              return 1
            fi
            sleep 1
          done
        }
        cleanup() {
          status=$?
          trap - EXIT
          cleanup_failed=false
          if [[ -n "$app_pid" ]]; then
            if ! stop_owned_process "$app_pid" "unsigned app"; then
              cleanup_failed=true
            fi
          fi
          if [[ -n "$app_child_pid" ]] \
            && ! stop_owned_process "$app_child_pid" "unsigned app backend"; then
            cleanup_failed=true
          fi
          if [[ "$status" -ne 0 && -f "$smoke_log" ]]; then
            cat "$smoke_log" >&2
          fi
          if [[ "$cleanup_failed" == "true" && "$status" -eq 0 ]]; then
            status=1
          fi
          exit "$status"
        }
        trap cleanup EXIT

        cd "$GITHUB_WORKSPACE"
        port="$(select_free_loopback_port)"
        "$app_executable" --headless \
          --repository-root "$GITHUB_WORKSPACE" \
          --port "$port" >"$smoke_log" 2>&1 &
        app_pid=$!
        health_url="http://127.0.0.1:${port}/api/health"
        readiness_deadline=$((SECONDS + 60))
        ready=false
        while (( SECONDS < readiness_deadline )); do
          if ! process_is_active "$app_pid"; then
            echo "Unsigned app exited before becoming ready." >&2
            print_readiness_diagnostics
            exit 1
          fi
          if listener_belongs_to_app_tree; then
            health_payload="$(curl --fail --silent --show-error "${readiness_curl_timeout_args[@]}" "$health_url" 2>/dev/null || true)"
            if python -c 'import json,sys; payload=json.load(sys.stdin); sys.exit(0 if isinstance(payload, dict) and payload == {"ok": True} and type(payload["ok"]) is bool else 1)' \
              <<<"$health_payload" 2>/dev/null \
              && listener_belongs_to_app_tree; then
              ready=true
              break
            fi
          fi
          sleep 1
        done
        if [[ "$ready" != "true" ]]; then
          echo "Unsigned app did not become ready at $health_url within 60 seconds." >&2
          print_readiness_diagnostics
          exit 1
        fi

        if ! listener_belongs_to_app_tree; then
          echo "Unsigned app health listener is no longer owned by the app." >&2
          print_readiness_diagnostics
          exit 1
        fi
        if ! health_payload="$(curl --fail --silent --show-error "${curl_timeout_args[@]}" "$health_url")"; then
          echo "Unsigned app health probe failed after readiness." >&2
          print_readiness_diagnostics
          exit 1
        fi
        if ! python -c 'import json,sys; payload=json.load(sys.stdin); sys.exit(0 if isinstance(payload, dict) and payload == {"ok": True} and type(payload["ok"]) is bool else 1)' \
          <<<"$health_payload" 2>/dev/null; then
          echo "Unsigned app health check failed after readiness." >&2
          print_readiness_diagnostics
          exit 1
        fi
        if ! listener_belongs_to_app_tree; then
          echo "Unsigned app health listener is no longer owned by the app." >&2
          print_readiness_diagnostics
          exit 1
        fi
        curl --fail --silent --show-error "${curl_timeout_args[@]}" "http://127.0.0.1:${port}/" >/dev/null
        while IFS= read -r asset_path; do
          curl --fail --silent --show-error "${curl_timeout_args[@]}" \
            "http://127.0.0.1:${port}${asset_path}" >/dev/null
        done < <(
          python - <<'PY'
        import sys

        sys.path.insert(0, "Tools/HangboardWorkbench")
        from workbench_assets import STATIC_ASSETS

        for asset in STATIC_ASSETS:
            print(f"/{asset}")
        PY
        )
        curl --fail --silent --show-error "${curl_timeout_args[@]}" "http://127.0.0.1:${port}/api/boards" \
          | python -c 'import json,sys; payload=json.load(sys.stdin); assert payload["ok"] is True; assert isinstance(payload["boards"], list); assert payload["boards"]; assert all(isinstance(board.get("boardId"), str) and board["boardId"] and isinstance(board.get("displayName"), str) and board["displayName"] and isinstance(board.get("holdCount"), int) and board["holdCount"] > 0 and board.get("href") == "/api/boards/" + board["boardId"] for board in payload["boards"])'

        app_child_pid="$(pgrep -P "$app_pid" || true)"
        if [[ -z "$app_child_pid" || "$app_child_pid" == *$'\n'* ]]; then
          echo "Expected exactly one backend owned by the unsigned app." >&2
          exit 1
        fi
        if ! stop_owned_process "$app_pid" "unsigned app"; then
          echo "Unsigned app did not exit cleanly after SIGTERM." >&2
          exit 1
        fi
        if kill -0 "$app_child_pid" 2>/dev/null; then
          echo "Unsigned app backend remained after app shutdown." >&2
          exit 1
        fi
        if grep -Eq 'Traceback|Exception ignored in atexit callback|could not start' "$smoke_log"; then
          echo "Unsigned app smoke log contains an error." >&2
          exit 1
        fi
        app_pid=""
        app_child_pid=""

    - name: Archive verified unsigned app
      shell: bash
      run: |
        set -euo pipefail
        release_dir="$GITHUB_WORKSPACE/.hangboard-workbench-release"
        cd "$release_dir"
        tar -czf hangboard-workbench-macos-arm64.tar.gz "Hangboard Workbench.app"
        shasum -a 256 hangboard-workbench-macos-arm64.tar.gz > hangboard-workbench-macos-arm64.sha256
        shasum -a 256 -c hangboard-workbench-macos-arm64.sha256

    # actions/upload-artifact v4.6.2
    - name: Upload verified unsigned app
      id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: hangboard-workbench-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ github.workspace }}/.hangboard-workbench-release/hangboard-workbench-macos-arm64.tar.gz
          ${{ github.workspace }}/.hangboard-workbench-release/hangboard-workbench-macos-arm64.sha256
        if-no-files-found: error
        compression-level: 0
