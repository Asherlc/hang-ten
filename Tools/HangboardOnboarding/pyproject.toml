[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hangboard-vectorizer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "Pillow>=10.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hangboard-catalog-outlines = "hangboard_vectorizer.catalog_outline_cli:main"
hangboard-onboard = "hangboard_vectorizer.onboard_cli:main"
hangboard-semantic-benchmark = "hangboard_vectorizer.semantic_benchmark:main"
hangboard-to-svg = "hangboard_vectorizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hangboard_vectorizer" = ["catalog_outline_sources.json"]
"hangboard_vectorizer.evidence" = ["*.json"]
"hangboard_vectorizer.products" = ["*.json", "*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
